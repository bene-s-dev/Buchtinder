      0% { transform: translateX(0); }

      0% { opacity: 0; transform: translate(-50%, -12px); }

      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -12px); }

    const LOADING_PHRASES = [
      '🧹 Das Verlagsarchiv wird durchstöbert...',
      '👻 Büchergeister werden freundlich gebeten zu weichen...',
      '⚜️ Geheime Privatsammlungen werden durchforstet...',

      '🐛 Erfahrene Lektoren werden befragt...',
      '✨ Exklusive Perlen werden ausgewählt...'
    ];

    const GENRES = [
      { id: 'fantasy', name: 'Fantasy & Magie' },
      { id: 'romantasy', name: 'Romantasy' },
      { id: 'thriller', name: 'Krimi & Thriller' },
      { id: 'scifi', name: 'Science Fiction' },
      { id: 'romance', name: 'Liebe & Romantik' },
      { id: 'humor', name: 'Humor & Satire' },
      { id: 'sachbuch', name: 'Sachbuch & Wissen' },
      { id: 'historisch', name: 'Historische Romane' },
      { id: 'jugend', name: 'Jugendbuch' },
      { id: 'belletristik', name: 'Belletristik' }
    ];

    const MOODS = [
      'Fesselnd & Hochspannung',
      'Gemütlich & Herz erwärmend',
      'Düster & Atmosphärisch',
      'Tiefgründig & Nachdenklich',
      'Amüsant & Locker'
    ];

    const LENGTHS = ['Egal', 'Kurz (< 300 S.)', 'Mittel (300-500 S.)', 'Wälzer (> 500 S.)'];

    const ERA_OPTIONS = ['Egal', 'Vor 2000', 'Nach 2000', 'Nach 2015'];

    function App() {
      const [supabaseClient, setSupabaseClient] = useState(null);

      // --- SUPABASE DYNAMISCH ÜBER VERCEL ENV LADEN ---
      useEffect(() => {
        fetch('/api/config')
          .then(res => res.json())
          .then(cfg => {
            if (cfg.url && cfg.key && window.supabase) {
              const client = window.supabase.createClient(cfg.url, cfg.key);
              setSupabaseClient(client);
            } else {
              console.error("Incomplete Supabase Configuration via /api/config");
            }
          })
          .catch(err => console.error("Konnte Supabase Config von Vercel nicht abrufen:", err));
      }, []);

      const [step, setStep] = useState(1);
      const [selectedGenres, setSelectedGenres] = useState(['fantasy']);
      const [selectedMoods, setSelectedMoods] = useState([MOODS[0]]);
      const [selectedLength, setSelectedLength] = useState('Egal');
      const [selectedEra, setSelectedEra] = useState('Egal');

      const [themesToSwipe, setThemesToSwipe] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [likedThemes, setLikedThemes] = useState([]);
      const [dislikedThemes, setDislikedThemes] = useState([]);

      // NEU: Session-Ausschluss für bereits angezeigte Bücher
      const [sessionShownBooks, setSessionShownBooks] = useState([]);

      const [showToast, setShowToast] = useState(false);

      const [exitDirection, setExitDirection] = useState(null);
      const [isAnimatingExit, setIsAnimatingExit] = useState(false);

      // STATE FÜR BUCH-MELDUNG
      const [reportingBook, setReportingBook] = useState(null);
      const [selectedReasons, setSelectedReasons] = useState([]);
      const [reportComment, setReportComment] = useState('');
      const [isSubmittingReport, setIsSubmittingReport] = useState(false);
      const [reportSuccess, setReportSuccess] = useState(false);

      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem('buchtinder_favorites');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [alreadyRead, setAlreadyRead] = useState(() => {
        try {
          const saved = localStorage.getItem('buchtinder_already_read');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [isFavoritesOpen, setIsFavoritesOpen] = useState(false);
      const [drawerTab, setDrawerTab] = useState('favorites');
      const [isDrawerClosing, setIsDrawerClosing] = useState(false);
      const [popHeartKey, setPopHeartKey] = useState(null);
      const [popBookKey, setPopBookKey] = useState(null);
      const [copyNotice, setCopyNotice] = useState('');

      const activeCardRef = useRef(null);

      useEffect(() => {
        const card = activeCardRef.current;
        if (!card) return;

        const preventPageScroll = (e) => {
          if (e.cancelable) {
            e.preventDefault();
          }
        };

        card.addEventListener('touchmove', preventPageScroll, { passive: false });
        return () => {
          card.removeEventListener('touchmove', preventPageScroll);
        };
      }, [step, currentIndex]);

      useEffect(() => {
        if (isFavoritesOpen || reportingBook) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => {
          document.body.style.overflow = '';
        };
      }, [isFavoritesOpen, reportingBook]);

      useEffect(() => {
        try {
          localStorage.setItem('buchtinder_favorites', JSON.stringify(favorites));
        } catch (e) {
          console.error('Konnte Favoriten nicht im localStorage speichern:', e);
        }
      }, [favorites]);

      useEffect(() => {
        try {
          localStorage.setItem('buchtinder_already_read', JSON.stringify(alreadyRead));
        } catch (e) {
          console.error('Konnte Bereits-Gelesen-Liste nicht im localStorage speichern:', e);
        }
      }, [alreadyRead]);

      const toggleFavorite = (book) => {
        const bookKey = `${book.title}-${book.author}`;
        setPopHeartKey(bookKey);
        setTimeout(() => setPopHeartKey(null), 500);

        setFavorites(prev => {
          const exists = prev.some(f => f.title === book.title && f.author === book.author);
          if (exists) {
            return prev.filter(f => !(f.title === book.title && f.author === book.author));
          } else {
            return [...prev, book];
          }
        });
      };

      const toggleAlreadyRead = (book) => {
        const bookKey = `${book.title}-${book.author}`;
        setPopBookKey(bookKey);
        setTimeout(() => setPopBookKey(null), 500);

        setAlreadyRead(prev => {
          const exists = prev.some(f => f.title === book.title && f.author === book.author);
          if (exists) {
            return prev.filter(f => !(f.title === book.title && f.author === book.author));
          } else {
            return [...prev, book];
          }
        });
      };

      const isFavorite = (book) => {
        return favorites.some(f => f.title === book.title && f.author === book.author);
      };

      const isAlreadyRead = (book) => {
        return alreadyRead.some(f => f.title === book.title && f.author === book.author);
      };

      const handleCloseDrawer = () => {
        setIsDrawerClosing(true);
        setTimeout(() => {
          setIsFavoritesOpen(false);
          setIsDrawerClosing(false);
        }, 300);
      };

      const handleShareFavorites = () => {
        if (favorites.length === 0) return;
        const formattedList = favorites.map((b, i) => `${i + 1}. "${b.title}" von ${b.author} (${b.genre})`).join('\n');
        const text = `📚 Meine Buch-Favoriten auf BuchKompass:\n\n${formattedList}\n\nFinde deinen nächsten Bestseller: https://buchkompass.benedrive.de!`;

        if (navigator.share) {
          navigator.share({
            title: 'Meine BuchKompass-Favoriten',
            text: text
          }).catch(() => {});
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          setCopyNotice('Text in Zwischenablage kopiert!');
          setTimeout(() => setCopyNotice(''), 3000);
        }
      };

      const toggleGenre = (genreId) => {
        setSelectedGenres(prev => {
          if (prev.includes(genreId)) {
            if (prev.length === 1) return prev;
            return prev.filter(id => id !== genreId);
          } else {
            return [...prev, genreId];
          }
        });
      };

      const toggleMood = (mood) => {
        setSelectedMoods(prev => {
          if (prev.includes(mood)) {
            if (prev.length === 1) return prev;
            return prev.filter(m => m !== mood);
          } else {
            return [...prev, mood];
          }
        });
      };

      // LOGIK FÜR BUCH-MELDUNG
      const handleToggleReportReason = (reason) => {
        setSelectedReasons(prev => 
          prev.includes(reason) ? prev.filter(r => r !== reason) : [...prev, reason]
        );
      };

      const handleSubmitReport = async () => {
        if (!reportingBook || (selectedReasons.length === 0 && !reportComment.trim())) return;
        setIsSubmittingReport(true);

        try {
          let client = supabaseClient;
          if (!client) {
            const res = await fetch('/api/config');
            const cfg = await res.json();
            if (cfg.url && cfg.key && window.supabase) {
              client = window.supabase.createClient(cfg.url, cfg.key);
              setSupabaseClient(client);
            }
          }

          if (client) {
            const { error } = await client.from('reports').insert([{
              book_title: reportingBook.title,
              book_author: reportingBook.author,
              book_isbn: reportingBook.isbn || null,
              reasons: selectedReasons,
              comment: reportComment.trim() || null
            }]);
            if (error) throw error;
          }

          setReportSuccess(true);
          setTimeout(() => {
            setReportingBook(null);
            setSelectedReasons([]);
            setReportComment('');
            setReportSuccess(false);
          }, 1800);
        } catch (err) {
          console.error("Fehler beim Senden der Meldung:", err);
          alert("Fehler beim Absenden der Meldung. Bitte versuche es später noch einmal.");
        } finally {
          setIsSubmittingReport(false);
        }
      };

      const [aiRecommendations, setAiRecommendations] = useState(null);
      const [isLoadingAi, setIsLoadingAi] = useState(false);
      const [isReloading, setIsReloading] = useState(false);
      const [aiError, setAiError] = useState('');
      const [loadingProgress, setLoadingProgress] = useState(0);
      const [loadingPhraseIndex, setLoadingPhraseIndex] = useState(0);

      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const dragStart = useRef({ x: 0, y: 0 });

      const startSwipingThemes = () => {
        // Beim Start einer neuen Suche Session-Ausschluss zurücksetzen
        setSessionShownBooks([]);

        // Filtere alle Motive, die zu mindestens einem der ausgewählten Hauptgenres passen
        let matchingThemes = STORY_THEMES.filter(st => 
          st.genreIds.some(gId => selectedGenres.includes(gId))
        );

        // Fallback falls ein Genre keine eigenen Motive hat
        if (matchingThemes.length === 0) {
          matchingThemes = STORY_THEMES.filter(st => st.genreIds.includes('belletristik'));
        }

        const finalSelection = matchingThemes
          .sort(() => 0.5 - Math.random())
          .slice(0, 12);

        setThemesToSwipe(finalSelection);
        setCurrentIndex(0);
        setLikedThemes([]);
        setDislikedThemes([]);
        setExitDirection(null);
        setIsAnimatingExit(false);
        setStep(2);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2800);
      };

      const handleDecision = (liked) => {
        if (currentIndex >= themesToSwipe.length || isAnimatingExit) return;

        setIsAnimatingExit(true);
        setExitDirection(liked ? 'right' : 'left');

        setTimeout(() => {
          const currentTheme = themesToSwipe[currentIndex];
          const newLiked = liked ? [...likedThemes, currentTheme] : likedThemes;
          const newDisliked = !liked ? [...dislikedThemes, currentTheme] : dislikedThemes;

          if (liked) {
            setLikedThemes(newLiked);
          } else {
            setDislikedThemes(newDisliked);
          }

          setDragOffset({ x: 0, y: 0 });
          setExitDirection(null);
          setIsAnimatingExit(false);

          if (currentIndex + 1 >= themesToSwipe.length) {
            setStep(3);
            fetchAiBookRecommendations(newLiked, newDisliked, false, false);
          } else {
            setCurrentIndex(prev => prev + 1);
          }
        }, 280);
      };

      // --- SUPABASE DIRECT QUERY WITH SESSION EXCLUSION ---
      const fetchAiBookRecommendations = async (likedList = likedThemes, dislikedList = dislikedThemes, excludeAlreadyRead = false, isReload = false) => {
        if (isReload) {
          setIsReloading(true);
        } else {
          setIsLoadingAi(true);
        }
        setAiError('');
        setLoadingProgress(0);
        setLoadingPhraseIndex(0);

        const startTime = Date.now();
        const DURATION = 10000;

        let progressInterval, phraseInterval;

        if (!isReload) {
          progressInterval = setInterval(() => {
            const elapsedTime = Date.now() - startTime;
            const progress = Math.min(Math.floor((elapsedTime / DURATION) * 100), 100);
            setLoadingProgress(progress);
          }, 50);

          phraseInterval = setInterval(() => {
            setLoadingPhraseIndex(prev => (prev + 1) % LOADING_PHRASES.length);
          }, 1750);
        }

        try {
          let client = supabaseClient;
          if (!client) {
            const res = await fetch('/api/config');
            const cfg = await res.json();
            if (cfg.url && cfg.key && window.supabase) {
              client = window.supabase.createClient(cfg.url, cfg.key);
              setSupabaseClient(client);
            } else {
              throw new Error("Umgebungsvariablen (SUPABASE_URL / SUPABASE_KEY) in Vercel fehlen oder sind leer.");
            }
          }

          let query = client.from('books').select('*');

          if (selectedGenres.length > 0) {
            query = query.in('genre', selectedGenres);
          }
          if (selectedLength !== 'Egal') {
            query = query.eq('length', selectedLength);
          }
          if (selectedEra !== 'Egal') {
            query = query.eq('era', selectedEra);
          }

          // Gelesene Bücher ausschließen
          if (excludeAlreadyRead && alreadyRead.length > 0) {
            const excludeIsbns = alreadyRead.map(b => b.isbn).filter(Boolean);
            if (excludeIsbns.length > 0) {
              query = query.not('isbn', 'in', `(${excludeIsbns.join(',')})`);
            }
          }

          // IN DIESER SESSION BEREITS ANGEZEIGTE BÜCHER AUSSCHLIESSEN
          if (sessionShownBooks.length > 0) {
            const shownIsbns = sessionShownBooks.map(b => b.isbn).filter(Boolean);
            if (shownIsbns.length > 0) {
              query = query.not('isbn', 'in', `(${shownIsbns.join(',')})`);
            }
          }

          const { data, error } = await query;

          if (error) throw error;

          let filteredBooks = data || [];

          // Falls durch den Session-Filter alle Bücher aufgebraucht wurden, Fallback ohne Session-Sperre
          if (filteredBooks.length === 0 && sessionShownBooks.length > 0) {
            let retryQuery = client.from('books').select('*');
            if (selectedGenres.length > 0) retryQuery = retryQuery.in('genre', selectedGenres);
            if (selectedLength !== 'Egal') retryQuery = retryQuery.eq('length', selectedLength);
            if (selectedEra !== 'Egal') retryQuery = retryQuery.eq('era', selectedEra);
            const retryRes = await retryQuery;
            filteredBooks = retryRes.data || [];
          }

          if (filteredBooks.length === 0) {
            if (progressInterval) clearInterval(progressInterval);
            if (phraseInterval) clearInterval(phraseInterval);
            setAiError("Keine weiteren passenden Bücher in der Datenbank gefunden.");
            return;
          }

          if (selectedMoods.length > 0) {
            const moodMatched = filteredBooks.filter(book => 
              Array.isArray(book.moods) && book.moods.some(m => selectedMoods.includes(m))
            );
            if (moodMatched.length > 0) {
              filteredBooks = moodMatched;
            }
          }

          const shuffled = filteredBooks.sort(() => 0.5 - Math.random());
          const selectedBooks = shuffled.slice(0, 12).map(b => ({
            title: b.title,
            author: b.author,
            year: b.year,
            genre: b.genre,
            description: b.description,
            matchReason: b.match_reason || "Passt perfekt zu deinen gewählten Filtern und Stimmungen.",
            isbn: b.isbn
          }));

          // Zu den in der Session bereits gezeigten Büchern hinzufügen
          setSessionShownBooks(prev => [...prev, ...selectedBooks]);

          if (!isReload) {
            const elapsedSoFar = Date.now() - startTime;
            const remainingTime = Math.max(DURATION - elapsedSoFar, 0);
            await new Promise(r => setTimeout(r, remainingTime));
            setLoadingProgress(100);
            await new Promise(r => setTimeout(r, 250));
          }

          setAiRecommendations({ books: selectedBooks });

        } catch (err) {
          console.error("Supabase Error:", err);
          setAiError(`Fehler beim Laden der Bücher aus Supabase (${err.message || 'Verbindungsfehler'}).`);
        } finally {
          if (progressInterval) clearInterval(progressInterval);
          if (phraseInterval) clearInterval(phraseInterval);
          setIsLoadingAi(false);
          setIsReloading(false);
        }
      };

      const onTouchStart = (e) => {
        if (isAnimatingExit) return;
        setIsDragging(true);
        const touch = e.touches[0];
        dragStart.current = { x: touch.clientX, y: touch.clientY };
      };

      const onTouchMove = (e) => {
        if (!isDragging || isAnimatingExit) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - dragStart.current.x;
        const deltaY = touch.clientY - dragStart.current.y;

        setDragOffset({ x: deltaX, y: deltaY });
      };

      const onTouchEnd = () => {
        if (!isDragging || isAnimatingExit) return;
        setIsDragging(false);
        if (dragOffset.x > 75) handleDecision(true);
        else if (dragOffset.x < -75) handleDecision(false);
        else setDragOffset({ x: 0, y: 0 });
      };

      const onMouseDown = (e) => {

        setDragOffset({ x: deltaX, y: deltaY });
      };

        if (!isDragging || isAnimatingExit) return;
        setIsDragging(false);

                        if (isTop) {

                            transform = 'translate(-120vw, 30px) rotate(-20deg) scale(1)';
                            opacity = 0;
                          } else {
                            transform = `translate(${dragOffset.x}px, ${dragOffset.y}px) rotate(${dragOffset.x * 0.08}deg) scale(1)`;
                          }
                        }

                        const positiveOpacity = isTop ? Math.min(Math.max(dragOffset.x / 75, 0), 1) : 0;
                        const negativeOpacity = isTop ? Math.min(Math.max(-dragOffset.x / 75, 0), 1) : 0;

                        return (
                          <div

                            }`}
                            style={{

                              transform,

                              transition: isTop && isDragging ? 'none' : 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease-out',

                            onTouchStart={isTop ? onTouchStart : undefined}
                            onTouchMove={isTop ? onTouchMove : undefined}
                            onTouchEnd={isTop ? onTouchEnd : undefined}
                            onMouseDown={isTop ? onMouseDown : undefined}
                            onMouseMove={isTop ? onMouseMove : undefined}
                            onMouseUp={isTop ? onMouseUp : undefined}
                            onMouseLeave={isTop ? onMouseUp : undefined}
                          >
                            {isTop && (

                      })}
                    </div>

                    <div className="flex items-center justify-center space-x-8 pt-2 z-40">
                      <button

                                  setReportSuccess(false);
                                }}
                                className="inline-flex items-center space-x-1 px-2.5 py-1 rounded-md bg-paper-100 hover:bg-rose-50 border border-paper-300 hover:border-rose-200 text-[10px] font-semibold text-ink-700 hover:text-rose-700 transition active:scale-95 shadow-2xs"
                                title="Bucheintrag melden"
                              >
                                <span>Melden</span>
                              </button>
                            </div>

                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* BUTTONS FÜR WEITERE VORSCHLÄGE & NEUE SUCHE */}
                {aiRecommendations && !isLoadingAi && (
                  <div className="pt-2 space-y-2.5">
                    <button
                      onClick={() => fetchAiBookRecommendations(likedThemes, dislikedThemes, false, true)}
                      disabled={isReloading}
                      className="w-full py-3.5 bg-burgundy-700 hover:bg-burgundy-800 text-white text-xs font-literary font-bold rounded-xl shadow-md transition-all duration-200 transform active:scale-[0.98] flex items-center justify-center space-x-2 disabled:opacity-80"
                    >
                      {isReloading ? (
                        <>
                          <svg className="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                          </svg>
                          <span>Lade neue Bücher...</span>
                        </>
                      ) : (
                        <span>🔄 Weitere Vorschläge laden</span>
                      )}
                    </button>

                    <button
                      onClick={() => {
                        setStep(1);
                        setAiRecommendations(null);
                      }}
                      className="w-full py-3 bg-white hover:bg-paper-50 text-ink-800 text-xs font-literary font-bold rounded-xl border border-paper-300 transition shadow-sm active:scale-[0.98]"
                    >
                      Neue Suche starten
                    </button>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* REPORT MODAL */}
          {reportingBook && (
            <div 
              onClick={(e) => { if (e.target === e.currentTarget) setReportingBook(null); }}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink-950/40 backdrop-blur-sm animate-backdrop-in"
            >
              <div className="bg-white border border-paper-300 rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4 max-h-[90vh] flex flex-col justify-between">
                
                {reportSuccess ? (
                  <div className="py-8 text-center space-y-2">
                    <div className="text-4xl">✅</div>
                    <h3 className="font-literary font-bold text-lg text-ink-900">Vielen Dank!</h3>
                    <p className="text-xs text-ink-700">Deine Meldung wurde erfolgreich gespeichert.</p>
                  </div>
                ) : (
                  <>
                    <div className="space-y-3 overflow-y-auto custom-scrollbar pr-1">
                      <div className="flex items-start justify-between border-b border-paper-200 pb-3">
                        <div>
                          <span className="text-[10px] font-bold text-rose-700 uppercase tracking-wider block">Eintrag melden</span>
                          <h3 className="font-literary font-bold text-base text-ink-900 leading-tight">{reportingBook.title}</h3>
                          <p className="text-xs text-ink-700">von {reportingBook.author}</p>
                        </div>
                        <button 
                          onClick={() => setReportingBook(null)}
                          className="text-ink-700 hover:text-ink-900 font-bold text-sm p-1"
                        >
                          ✕
                        </button>
                      </div>

                      <p className="text-xs text-ink-800 font-medium">Was stimmt mit diesem Bucheintrag nicht?</p>

                      <div className="space-y-1.5">
                        {REPORT_REASONS.map((reason, i) => {
                          const checked = selectedReasons.includes(reason);
                          return (
                            <div 
                              key={i} 
                              onClick={() => handleToggleReportReason(reason)}
                              className={`flex items-center space-x-3 p-2.5 rounded-xl border text-xs cursor-pointer transition select-none ${
                                checked 
                                  ? 'bg-burgundy-50 border-burgundy-300 text-burgundy-900 font-semibold' 
                                  : 'bg-paper-50 border-paper-200 text-ink-800 hover:bg-paper-100'
                              }`}
                            >
                              <input 
                                type="checkbox" 
                                checked={checked} 
                                onChange={() => {}} 
                                className="rounded text-burgundy-700 focus:ring-burgundy-700 h-4 w-4 pointer-events-none"
                              />
                              <span className="pointer-events-none">{reason}</span>
                            </div>
                          );
                        })}
                      </div>

                      <div className="space-y-1 pt-1">
                        <label className="text-xs font-medium text-ink-800 block">Zusätzliche Anmerkung (optional):</label>
                        <textarea
                          rows="2"
                          value={reportComment}
                          onChange={(e) => setReportComment(e.target.value)}
                          placeholder="z. B. Der Titel heißt eigentlich..."
                          className="w-full p-2.5 rounded-xl border border-paper-300 bg-paper-50 text-xs text-ink-900 focus:outline-none focus:border-burgundy-700 resize-none font-sans"
                        />
                      </div>
                    </div>

                    <div className="pt-3 border-t border-paper-200 flex items-center space-x-2">
                      <button
                        onClick={() => setReportingBook(null)}
                        className="flex-1 py-2.5 bg-paper-100 hover:bg-paper-200 text-ink-800 text-xs font-bold rounded-xl border border-paper-300 transition"
                      >
                        Abbrechen
                      </button>
                      <button
                        onClick={handleSubmitReport}
                        disabled={(selectedReasons.length === 0 && !reportComment.trim()) || isSubmittingReport}
                        className={`flex-1 py-2.5 text-xs font-bold rounded-xl shadow-sm transition ${
                          (selectedReasons.length === 0 && !reportComment.trim()) || isSubmittingReport
                            ? 'bg-paper-300 text-paper-400 cursor-not-allowed'
                            : 'bg-burgundy-700 hover:bg-burgundy-800 text-white active:scale-95'
                        }`}
                      >
                        {isSubmittingReport ? 'Sende...' : 'Meldung absenden'}
                      </button>
                    </div>
                  </>
                )}

              </div>
            </div>
          )}

          {/* DRAWER (FAVORITES & ALREADY READ) */}
          {isFavoritesOpen && (
            <div 
              onClick={(e) => { if (e.target === e.currentTarget) handleCloseDrawer(); }}
              className={`fixed inset-0 z-50 flex justify-end bg-ink-950/40 backdrop-blur-sm ${
                isDrawerClosing ? 'opacity-0 transition-opacity duration-300' : 'animate-backdrop-in'
              }`}
            >
              <div 
                className={`bg-paper-100 w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-5 border-l border-paper-300 overflow-hidden ${
                  isDrawerClosing ? 'animate-drawer-out' : 'animate-drawer-in'
                }`}
              >
                <div>
                  <div className="flex items-center justify-between pb-3 border-b border-paper-300">
                    <div className="flex items-center space-x-2">
                      <span className="text-xl">📚</span>
                      <h2 className="font-literary font-bold text-lg text-ink-900">Deine Bibliothek</h2>
                    </div>
                    <button
                      onClick={handleCloseDrawer}
                      className="w-8 h-8 rounded-full bg-paper-200 hover:bg-paper-300 text-ink-800 font-bold flex items-center justify-center transition active:scale-95"
                    >
                      ✕
                    </button>
                  </div>

                  {/* TAB SWITCHER */}
                  <div className="flex rounded-xl bg-paper-200 p-1 my-3 border border-paper-300">
                    <button
                      onClick={() => setDrawerTab('favorites')}
                      className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${
                        drawerTab === 'favorites' 
                          ? 'bg-burgundy-700 text-white shadow-sm' 
                          : 'text-ink-700 hover:text-ink-900'
                      }`}
                    >
                      ❤️ Favoriten ({favorites.length})
                    </button>
                    <button
                      onClick={() => setDrawerTab('alreadyRead')}
                      className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${
                        drawerTab === 'alreadyRead' 
                          ? 'bg-amber-600 text-white shadow-sm' 
                          : 'text-ink-700 hover:text-ink-900'
                      }`}
                    >
                      📖 Schon gelesen ({alreadyRead.length})
                    </button>
                  </div>
                </div>

                {drawerTab === 'favorites' && favorites.length > 0 && (
                  <div className="mb-2 space-y-2">
                    <button
                      onClick={handleShareFavorites}
                      className="w-full py-2.5 px-3 bg-burgundy-700 hover:bg-burgundy-800 text-white text-xs font-medium rounded-xl shadow-sm flex items-center justify-center space-x-2 transition active:scale-95"
                    >
                      <ShareIcon className="w-4 h-4" />
                      <span>Favoriten-Liste teilen / kopieren</span>
                    </button>
                    {copyNotice && (
                      <p className="text-[11px] text-emerald-800 bg-emerald-50 border border-emerald-200 p-1.5 rounded-lg text-center font-medium transition">
                        ✓ {copyNotice}
                      </p>
                    )}
                  </div>
                )}

                {drawerTab === 'alreadyRead' && alreadyRead.length > 0 && (
                  <div className="mb-2 space-y-2">
                    <button
                      onClick={() => {
                        handleCloseDrawer();
                        fetchAiBookRecommendations(likedThemes, dislikedThemes, true, true);
                      }}
                      className="w-full py-2.5 px-3 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl shadow-sm flex items-center justify-center space-x-2 transition active:scale-95"
                    >
                      <span>🔄 Nochmal suchen (Bereits gelesene ausschließen)</span>
                    </button>
                  </div>
                )}

                <div className="bg-amber-50/80 border border-amber-200 p-2.5 rounded-xl my-1 text-[11px] text-amber-900 flex items-start space-x-2 leading-relaxed">
                  <span className="text-sm flex-shrink-0">ℹ️</span>
                  <p>
                    <strong>Hinweis:</strong> Deine Listen werden im Browser gespeichert und gehen verloren wenn du Browserdaten löschst (z. B. Cookies).
                  </p>
                </div>

                {/* LIST CONTENT */}
                <div className="flex-grow overflow-y-auto space-y-3 custom-scrollbar my-2 pr-1">
                  {drawerTab === 'favorites' ? (
                    favorites.length === 0 ? (
                      <div className="text-center py-12 space-y-2">
                        <div className="text-3xl opacity-50">💔</div>
                        <p className="font-literary text-sm text-ink-800 font-medium">Noch keine Favoriten gespeichert.</p>
                        <p className="text-xs text-ink-700 max-w-xs mx-auto">
                          Tippe bei Empfehlungen auf das Herz-Symbol, um Bücher in deine Merkliste aufzunehmen.
                        </p>
                      </div>
                    ) : (
                      favorites.map((book, idx) => (
                        <div 
                          key={idx}
                          className="bg-white border border-paper-300 rounded-xl p-3.5 shadow-sm space-y-2 relative transition hover:border-burgundy-600/30"
                        >
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <span className="text-[10px] font-bold text-burgundy-700 uppercase tracking-wider block">
                                {book.genre} ({book.year})
                              </span>
                              <h4 className="font-literary font-bold text-sm text-ink-900 leading-tight">
                                {book.title}
                              </h4>
                              <p className="text-xs text-ink-700 font-medium">
                                von {book.author}
                              </p>
                            </div>
                            <button
                              onClick={() => toggleFavorite(book)}
                              className="text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg text-xs font-bold transition flex-shrink-0 active:scale-95"
                              title="Aus Favoriten entfernen"
                            >
                              ✕
                            </button>
                          </div>
                          {book.matchReason && (
                            <p className="text-[11px] text-burgundy-900 bg-burgundy-50 p-2 rounded-lg">
                              🎯 {book.matchReason}
                            </p>
                          )}
                        </div>
                      ))
                    )
                  ) : (
                    alreadyRead.length === 0 ? (
                      <div className="text-center py-12 space-y-2">
                        <div className="text-3xl opacity-50">📖</div>
                        <p className="font-literary text-sm text-ink-800 font-medium">Noch keine Bücher als gelesen markiert.</p>
                        <p className="text-xs text-ink-700 max-w-xs mx-auto">
                          Tippe bei Empfehlungen auf das Bücher-Symbol, um gelesene Bücher zu markieren.
                        </p>
                      </div>
                    ) : (
                      alreadyRead.map((book, idx) => (
                        <div 
                          key={idx}
                          className="bg-white border border-paper-300 rounded-xl p-3.5 shadow-sm space-y-2 relative transition hover:border-amber-600/30"
                        >
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <span className="text-[10px] font-bold text-amber-700 uppercase tracking-wider block">
                                Schon gelesen &bull; {book.genre}
                              </span>
                              <h4 className="font-literary font-bold text-sm text-ink-900 leading-tight">
                                {book.title}
                              </h4>
                              <p className="text-xs text-ink-700 font-medium">
                                von {book.author}
                              </p>
                            </div>
                            <button
                              onClick={() => toggleAlreadyRead(book)}
                              className="text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg text-xs font-bold transition flex-shrink-0 active:scale-95"
                              title="Aus 'Schon gelesen' entfernen"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ))
                    )
                  )}
                </div>

                <div className="pt-3 border-t border-paper-300">
                  <button
                    onClick={handleCloseDrawer}
                    className="w-full py-2.5 bg-ink-900 hover:bg-ink-950 text-paper-50 text-xs font-literary font-bold rounded-xl transition shadow-sm active:scale-98"
                  >
                    Schließen
                  </button>
                </div>

              </div>
            </div>
          )}

          <footer className="bg-paper-50 border-t border-paper-300 py-3.5 text-center text-[11px] text-ink-700 font-literary">
            BuchKompass &bull; Bene 2026
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
