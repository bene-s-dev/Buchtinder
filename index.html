    ];

    const LOADING_PHRASES = [
      '🧹 Das Verlagsarchiv wird durchstöbert...',
      '👓 Leseempfehlungen werden kuratiert...',
      '👻 Büchergeister werden freundlich gebeten zu weichen...',
      '⚜️ Geheime Privatsammlungen werden durchforstet...',
      '🔖 Erstausgaben werden durchgesehen...',
      '🕯️ Dachbodenfunde werden gesichtet...',
      '🏛️ Verlagsregister werden konsultiert...',
      '🔍 Literarische Schätze werden aufgespürt...',
      '🐛 Erfahrene Lektoren werden befragt...',
      '✨ Exklusive Perlen werden ausgewählt...'
    ];

    const GENRES = [
      { id: 'fantasy', name: 'Fantasy & Magie' },
      { id: 'romantasy', name: 'Romantasy' },
      { id: 'thriller', name: 'Krimi & Thriller' },
      { id: 'scifi', name: 'Science Fiction' },
      { id: 'romance', name: 'Liebe & Romantik' },
      { id: 'humor', name: 'Humor & Satire' },
      { id: 'sachbuch', name: 'Sachbuch & Wissen' },
      { id: 'historisch', name: 'Historische Romane' },
      { id: 'jugend', name: 'Jugendbuch & Belletristik' }
    ];

    const EXTRA_GENRES = [
      { id: 'new_adult', name: 'New Adult (Gegenwartsliteratur)', desc: 'Geschichten über die Lebensrealität, Identitätssuche und Herausforderungen junger Erwachsener (ca. 18–25 Jahre).' },
      { id: 'dark_romance', name: 'Dark Romance', desc: 'Düstere Romane mit Fokus auf Antihelden, Machtdynamiken und Tabuthemen (stark abgegrenzt von klassischer Liebesromantik).' },
      { id: 'cozy_crime', name: 'Cozy Crime / Cosy Mystery', desc: 'Unblutige, humorfreie Kriminalfälle in meist ländlicher oder gemütlicher Kulisse ohne harte Thriller-Elemente.' },
      { id: 'graphic_novels', name: 'Graphic Novels / Manga / Manhwa', desc: 'Visuell erzählte Geschichten für Erwachsene und junge Erwachsene quer durch alle Themen.' },
      { id: 'modern_poetry', name: 'Modern Poetry / Instapoetry', desc: 'Moderne Kurzlyrik zu Themen wie Selbstliebe, Aufarbeitung von Mental Health und Beziehungen.' },
      { id: 'memoir', name: 'Memoir & Autobiografie', desc: 'Persönliche, narrativ aufgearbeitete Lebensgeschichten abseits klassischer Fach- und Sachbücher.' }
    ];

    const MOODS = [
      'Fesselnd & Hochspannung',
      'Gemütlich & Herz erwärmend',
      'Düster & Atmosphärisch',
      'Tiefgründig & Nachdenklich',
      'Amüsant & Locker'
    ];

    const LENGTHS = ['Egal', 'Kurz (< 300 S.)', 'Mittel (300-500 S.)', 'Wälzer (> 500 S.)'];

    function App() {
      const [step, setStep] = useState(1);
      const [selectedGenres, setSelectedGenres] = useState(['fantasy']);
      const [selectedMoods, setSelectedMoods] = useState([MOODS[0]]);
      const [selectedLength, setSelectedLength] = useState('Egal');

      const [themesToSwipe, setThemesToSwipe] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [likedThemes, setLikedThemes] = useState([]);
      const [dislikedThemes, setDislikedThemes] = useState([]);

      const [showToast, setShowToast] = useState(false);

      const [exitDirection, setExitDirection] = useState(null);
      const [isAnimatingExit, setIsAnimatingExit] = useState(false);

      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem('buchtinder_favorites');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [isFavoritesOpen, setIsFavoritesOpen] = useState(false);
      const [isDrawerClosing, setIsDrawerClosing] = useState(false);
      const [popHeartKey, setPopHeartKey] = useState(null);
      const [copyNotice, setCopyNotice] = useState('');

      const activeCardRef = useRef(null);

      useEffect(() => {
        const card = activeCardRef.current;
        if (!card) return;

        const preventPageScroll = (e) => {
          if (e.cancelable) {
            e.preventDefault();
          }
        };

        card.addEventListener('touchmove', preventPageScroll, { passive: false });
        return () => {
          card.removeEventListener('touchmove', preventPageScroll);
        };
      }, [step, currentIndex]);

      useEffect(() => {
        if (isFavoritesOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => {
          document.body.style.overflow = '';
        };
      }, [isFavoritesOpen]);

      useEffect(() => {
        try {
          localStorage.setItem('buchtinder_favorites', JSON.stringify(favorites));
        } catch (e) {
          console.error('Konnte Favoriten nicht im localStorage speichern:', e);
        }
      }, [favorites]);

      const toggleFavorite = (book) => {
        const bookKey = `${book.title}-${book.author}`;
        setPopHeartKey(bookKey);
        setTimeout(() => setPopHeartKey(null), 500);

        setFavorites(prev => {
          const exists = prev.some(f => f.title === book.title && f.author === book.author);
          if (exists) {
            return prev.filter(f => !(f.title === book.title && f.author === book.author));
          } else {
            return [...prev, book];
          }
        });
      };

      const isFavorite = (book) => {
        return favorites.some(f => f.title === book.title && f.author === book.author);
      };

      const handleCloseDrawer = () => {
        setIsDrawerClosing(true);
        setTimeout(() => {
          setIsFavoritesOpen(false);
          setIsDrawerClosing(false);
        }, 300);
      };

      const handleShareFavorites = () => {
        if (favorites.length === 0) return;
        const formattedList = favorites.map((b, i) => `${i + 1}. "${b.title}" von ${b.author} (${b.genre})`).join('\n');
        const text = `📚 Meine Buch-Favoriten auf BuchKompass:\n\n${formattedList}\n\nFinde deinen nächsten Bestseller: https://buchkompass.benedrive.de!`;

        if (navigator.share) {
          navigator.share({
            title: 'Meine BuchKompass-Favoriten',
            text: text
          }).catch(() => {});
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          setCopyNotice('Text in Zwischenablage kopiert!');
          setTimeout(() => setCopyNotice(''), 3000);
        }
      };

      const toggleGenre = (genreId) => {
        setSelectedGenres(prev => {
          if (prev.includes(genreId)) {
            if (prev.length === 1) return prev; // Mindestens ein Genre ausgewählt lassen
            return prev.filter(id => id !== genreId);
          } else {
            return [...prev, genreId];
          }
        });
      };

      const toggleMood = (mood) => {
        setSelectedMoods(prev => {
          if (prev.includes(mood)) {
            if (prev.length === 1) return prev; // Mindestens eine Stimmung ausgewählt lassen
            return prev.filter(m => m !== mood);
          } else {
            return [...prev, mood];
          }
        });
      };

      const handleDropdownSelect = (e) => {
        const val = e.target.value;
        if (val) {
          if (!selectedGenres.includes(val)) {
            setSelectedGenres(prev => [...prev, val]);
          }
          e.target.value = "";
        }
      };

      const [aiRecommendations, setAiRecommendations] = useState(null);
      const [isLoadingAi, setIsLoadingAi] = useState(false);
      const [aiError, setAiError] = useState('');
      const [loadingProgress, setLoadingProgress] = useState(0);
      const [loadingPhraseIndex, setLoadingPhraseIndex] = useState(0);

      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const dragStart = useRef({ x: 0, y: 0 });

      const startSwipingThemes = () => {
        let pool = STORY_THEMES.filter(st => st.genreIds.some(gId => selectedGenres.includes(gId)));
        
        if (pool.length < 5) {
          const extra = STORY_THEMES.filter(st => !st.genreIds.some(gId => selectedGenres.includes(gId)));
          pool = [...pool, ...extra];
        }

        const shuffled = pool.sort(() => 0.5 - Math.random()).slice(0, 8);
        setThemesToSwipe(shuffled);
        setCurrentIndex(0);
        setLikedThemes([]);
        setDislikedThemes([]);
        setExitDirection(null);
        setIsAnimatingExit(false);
        setStep(2);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2800);
      };

      const handleDecision = (liked) => {
        if (currentIndex >= themesToSwipe.length || isAnimatingExit) return;

        setIsAnimatingExit(true);
        setExitDirection(liked ? 'right' : 'left');

        setTimeout(() => {
          const currentTheme = themesToSwipe[currentIndex];
          const newLiked = liked ? [...likedThemes, currentTheme] : likedThemes;
          const newDisliked = !liked ? [...dislikedThemes, currentTheme] : dislikedThemes;

          if (liked) {
            setLikedThemes(newLiked);
          } else {
            setDislikedThemes(newDisliked);
          }

          setDragOffset({ x: 0, y: 0 });
          setExitDirection(null);
          setIsAnimatingExit(false);

          if (currentIndex + 1 >= themesToSwipe.length) {
            setStep(3);
            fetchAiBookRecommendations(newLiked, newDisliked);
          } else {
            setCurrentIndex(prev => prev + 1);
          }
        }, 280);
      };

      const fetchAiBookRecommendations = async (likedList = likedThemes, dislikedList = dislikedThemes) => {
        setIsLoadingAi(true);
        setAiError('');
        setLoadingProgress(5);
        setLoadingPhraseIndex(0);

        const progressInterval = setInterval(() => {
          setLoadingProgress(prev => {
            if (prev >= 95) return prev;
            let increment = 0;
            if (prev < 30) increment = Math.floor(Math.random() * 5) + 3;
            else if (prev < 65) increment = Math.floor(Math.random() * 4) + 2;
            else if (prev < 85) increment = Math.floor(Math.random() * 3) + 1;
            else increment = 1;
            return Math.min(prev + increment, 95);
          });
        }, 320);

        const phraseInterval = setInterval(() => {
          setLoadingPhraseIndex(prev => (prev + 1) % LOADING_PHRASES.length);
        }, 2800);

        const allGenresList = [...GENRES, ...EXTRA_GENRES];
        const genreNames = selectedGenres.map(id => allGenresList.find(g => g.id === id)?.name || id).join(', ');
        const moodText = selectedGenres.includes('sachbuch') && selectedGenres.length === 1 
          ? 'Fokussiert & Informativ (Sachbuch)' 
          : selectedMoods.join(', ');

        const prompt = `Du bist ein erfahrener Verlagslektor und Literaturkenner mit tiefem Fachwissen.
Der Nutzer sucht konkrete, ECHTE, existierende Buch-Empfehlungen auf Deutsch basierend auf folgenden Kriterien:

- Ausgewählte Genres (Mehrfachauswahl): ${genreNames}
- Gewünschte Stimmung(en): ${moodText}
- Bevorzugter Umfang: ${selectedLength}

STORY-ELEMENTE & THEMEN, DIE DER NUTZER WICHTIG / SPANNEND FINDET:
${likedList.length > 0 ? likedList.map(t => `- ${t.title}: "${t.description}"`).join('\n') : 'Keine spezifischen Favoriten gewählt'}

STORY-ELEMENTE / STIMMUNGEN, DIE DER NUTZER NICHT MAG:
${dislikedList.length > 0 ? dislikedList.map(t => `- ${t.title}`).join('\n') : 'Keine Einschränkungen'}

Antworte mir ausschließlich im folgenden JSON-Format ohne zusätzlichen Fließtext drumherum:
{
  "summary": "Ein eleganter, begeisternder Satz des Lektors über das Leseprofil des Nutzers.",
  "books": [
    {
      "title": "Echter Buchtitel",
      "author": "Echter Autor",
      "year": "Erscheinungsjahr",
      "genre": "Genre",
      "description": "Ausführlicher, echter Klappentext des Buches (3-4 Sätze auf Deutsch).",
      "matchReason": "Warum dieses Buch perfekt zu den gewischten Themen passt."
    }
  ]
}
Liefere genau 4 hochwertige, echte Buchempfehlungen.`;

        try {
          const res = await fetch('/api/gemini', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          });

          const data = await res.json();

          if (data.error) {
            const errorMsg = typeof data.error === 'string' 
              ? data.error 
              : `Leider sind alle Bibliothekare im Urlaub (${data.error.message || 'Unbekannter API-Fehler'}).`;
            setAiError(errorMsg);
            return;
          }

          const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;

          if (responseText) {
            let jsonStr = responseText.trim();
            const jsonMatch = jsonStr.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              jsonStr = jsonMatch[0];
            }
            const parsed = JSON.parse(jsonStr);
            setLoadingProgress(100);
            await new Promise(r => setTimeout(r, 300));
            setAiRecommendations(parsed);
          } else {
            setAiError("Leider sind alle Bibliothekare im Urlaub (Keine gültigen Buchdaten empfangen).");
          }
        } catch (err) {
          console.error("Gemini Error:", err);
          setAiError(`Leider sind alle Bibliothekare im Urlaub (${err.message || 'Verbindungsfehler'}).`);
        } finally {
          clearInterval(progressInterval);
          clearInterval(phraseInterval);
          setIsLoadingAi(false);
        }
      };

      const onTouchStart = (e) => {
        if (isAnimatingExit) return;
        setIsDragging(true);
        const touch = e.touches[0];
        dragStart.current = { x: touch.clientX, y: touch.clientY };
      };

      const onTouchMove = (e) => {
        if (!isDragging || isAnimatingExit) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - dragStart.current.x;
        const deltaY = touch.clientY - dragStart.current.y;

        setDragOffset({ x: deltaX, y: deltaY });
      };

      const onTouchEnd = () => {
        if (!isDragging || isAnimatingExit) return;
        setIsDragging(false);
        if (dragOffset.x > 75) handleDecision(true);
        else if (dragOffset.x < -75) handleDecision(false);
        else setDragOffset({ x: 0, y: 0 });
      };

      const onMouseDown = (e) => {
        if (isAnimatingExit) return;
        setIsDragging(true);
        dragStart.current = { x: e.clientX, y: e.clientY };
      };

      const onMouseMove = (e) => {
        if (!isDragging || isAnimatingExit) return;
        const deltaX = e.clientX - dragStart.current.x;
        const deltaY = e.clientY - dragStart.current.y;
        setDragOffset({ x: deltaX, y: deltaY });
      };

      const onMouseUp = () => {
        if (!isDragging || isAnimatingExit) return;
        setIsDragging(false);
        if (dragOffset.x > 75) handleDecision(true);
        else if (dragOffset.x < -75) handleDecision(false);
        else setDragOffset({ x: 0, y: 0 });
      };

      return (
        <div className="flex flex-col min-h-screen">
          <header className="bg-paper-50/90 backdrop-blur-md border-b border-paper-300 sticky top-0 z-40 px-4 py-3.5 shadow-sm">
            <div className="max-w-md mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setStep(1)}>
                <div className="w-9 h-9 rounded-lg bg-burgundy-700 text-white flex items-center justify-center font-literary font-bold text-lg shadow-sm">
                  B
                </div>
                <div>
                  <h1 className="font-literary font-bold text-xl tracking-tight text-ink-900">
                    BuchKompass
                  </h1>
                  <p className="text-[10px] text-burgundy-700 font-semibold tracking-wider uppercase">
                    Finde dein nächstes Buch!
                  </p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                {step === 2 && (
                  <span className="text-xs font-literary font-medium px-3 py-1 bg-paper-200 border border-paper-300 text-ink-800 rounded-full">
                    Motiv {currentIndex + 1} von {themesToSwipe.length}
                  </span>
                )}

                <button 
                  onClick={() => setIsFavoritesOpen(true)}
                  className="p-2.5 rounded-xl bg-paper-100 hover:bg-paper-200 border border-paper-300 text-ink-800 transition-all duration-200 active:scale-95 relative flex items-center justify-center shadow-sm"
                  title="Favoriten anzeigen"
                >
                  <span className="text-lg leading-none">☰</span>
                  {favorites.length > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-burgundy-700 text-white text-[10px] font-bold rounded-full flex items-center justify-center shadow">
                      {favorites.length}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          <main className="flex-grow flex flex-col justify-center px-4 py-6 max-w-md mx-auto w-full relative">
            
            {/* STEP 1: PREFERENCES */}
            {step === 1 && (
              <div key="step-1" className="step-transition space-y-6">
                <div className="text-center space-y-1.5">
                  <span className="inline-block px-3 py-0.5 bg-burgundy-50 border border-burgundy-100 text-burgundy-700 rounded-full text-xs font-semibold tracking-wide uppercase">
                    Schritt 1 von 3
                  </span>
                  <h2 className="font-literary text-2xl font-bold text-ink-900">
                    Was möchtest du lesen?
                  </h2>
                </div>

                {/* Genre Selector */}
                <div className="space-y-2">
                  <label className="text-xs font-literary font-bold text-burgundy-800 uppercase tracking-wider block">
                    1. Genres wählen (Mehrfachauswahl möglich)
                  </label>
                  <div className="grid grid-cols-2 gap-2">
                    {GENRES.map(g => {
                      const isSelected = selectedGenres.includes(g.id);
                      return (
                        <button
                          key={g.id}
                          onClick={() => toggleGenre(g.id)}
                          className={`p-3 rounded-xl text-left text-xs font-medium transition-all duration-200 border flex items-center justify-between ${
                            isSelected 
                              ? 'bg-burgundy-700 border-burgundy-800 text-white font-semibold shadow-sm scale-[1.01]' 
                              : 'bg-white border-paper-300 text-ink-800 hover:border-burgundy-600/40 hover:bg-paper-50'
                          }`}
                        >
                          <span className="truncate">{g.name}</span>
                          {isSelected && <span className="font-bold text-xs ml-1">✓</span>}
                        </button>
                      );
                    })}
                  </div>

                  {/* Dropdown for Special Genres */}
                  <div className="pt-2">
                    <select
                      onChange={handleDropdownSelect}
                      defaultValue=""
                      className="w-full p-3 rounded-xl bg-white border border-paper-300 text-xs text-ink-800 focus:outline-none focus:border-burgundy-700 font-medium"
                    >
                      <option value="" disabled>Weitere spezifische Subgenres hinzufügen...</option>
                      {EXTRA_GENRES.map(eg => (
                        <option key={eg.id} value={eg.id} disabled={selectedGenres.includes(eg.id)}>
                          {eg.name} {selectedGenres.includes(eg.id) ? '(ausgewählt)' : ''}
                        </option>
                      ))}
                    </select>
                  </div>

                  {/* Display Selected Special Genres Badges */}
                  {selectedGenres.some(id => EXTRA_GENRES.some(eg => eg.id === id)) && (
                    <div className="flex flex-wrap gap-1.5 pt-1">
                      {selectedGenres.filter(id => EXTRA_GENRES.some(eg => eg.id === id)).map(id => {
                        const item = EXTRA_GENRES.find(eg => eg.id === id);
                        return (
                          <span key={id} className="inline-flex items-center space-x-1 px-2.5 py-1 bg-burgundy-100 text-burgundy-900 border border-burgundy-200 rounded-lg text-[11px] font-medium">
                            <span>{item?.name.split(':')[0]}</span>
                            <button onClick={() => toggleGenre(id)} className="font-bold text-burgundy-700 hover:text-burgundy-900 ml-1">✕</button>
                          </span>
                        );
                      })}
                    </div>
                  )}
                </div>

                {/* Mood Selector */}
                {(!selectedGenres.includes('sachbuch') || selectedGenres.length > 1) && (
                  <div className="space-y-2">
                    <label className="text-xs font-literary font-bold text-burgundy-800 uppercase tracking-wider block">
                      2. Gewünschte Stimmung(en) (Mehrfachauswahl)
                    </label>
                    <div className="space-y-1.5">
                      {MOODS.map(m => {
                        const isSelected = selectedMoods.includes(m);
                        return (
                          <button
                            key={m}
                            onClick={() => toggleMood(m)}
                            className={`w-full p-2.5 rounded-xl text-left px-4 text-xs font-medium transition-all duration-200 border flex items-center justify-between ${
                              isSelected
                                ? 'bg-burgundy-700 border-burgundy-800 text-white font-semibold shadow-sm scale-[1.01]'
                                : 'bg-white border-paper-300 text-ink-800 hover:border-burgundy-600/40 hover:bg-paper-50'
                            }`}
                          >
                            <span>{m}</span>
                            {isSelected && <span className="font-bold text-xs ml-1">✓</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Length Selector */}
                <div className="space-y-2">
                  <label className="text-xs font-literary font-bold text-burgundy-800 uppercase tracking-wider block">
                    3. Umfang
                  </label>
                  <div className="grid grid-cols-2 gap-2">
                    {LENGTHS.map(l => (
                      <button
                        key={l}
                        onClick={() => setSelectedLength(l)}
                        className={`p-2.5 rounded-xl text-center text-xs font-medium transition-all duration-200 border ${
                          selectedLength === l
                            ? 'bg-burgundy-700 border-burgundy-800 text-white font-semibold shadow-sm scale-[1.01]'
                            : 'bg-white border-paper-300 text-ink-800 hover:border-burgundy-600/40 hover:bg-paper-50'
                        }`}
                      >
                        {l}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Submit Button */}
                <button
                  onClick={startSwipingThemes}
                  className="w-full py-3.5 bg-ink-900 hover:bg-ink-950 text-paper-50 font-literary font-bold text-base rounded-xl shadow-md transition-all duration-200 transform active:scale-[0.98] flex items-center justify-center space-x-2 tracking-wide"
                >
                  <span>Los geht's!</span>
                </button>
              </div>
            )}

            {/* STEP 2: SWIPE MOTIFS */}
            {step === 2 && (
              <div key="step-2" className="step-transition flex flex-col items-center justify-between flex-grow py-2 relative">
                
                {showToast && (
                  <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 animate-toast pointer-events-none">
                    <div className="bg-ink-900/95 text-white border border-paper-300/30 text-xs font-semibold px-4 py-2 rounded-full shadow-xl backdrop-blur-md flex items-center space-x-2">
                      <span>👉</span>
                      <span>Swipe nach rechts oder links!</span>
                    </div>
                  </div>
                )}

                {currentIndex < themesToSwipe.length ? (
                  <div className="w-full space-y-4 my-auto flex flex-col items-center">
                    
                    <div className="text-center space-y-1">
                      <span className="inline-block px-3 py-0.5 bg-burgundy-50 border border-burgundy-100 text-burgundy-700 rounded-full text-xs font-semibold tracking-wide uppercase">
                        Schritt 2: Handlungen & Motive
                      </span>
                      <p className="text-xs text-ink-700">Soll dieses Motiv in deiner Lektüre vorkommen?</p>
                    </div>

                    <div className="relative w-full h-[400px] max-w-sm flex items-center justify-center my-2 touch-none">
                      {themesToSwipe.slice(currentIndex, currentIndex + 2).map((theme, relativeIdx) => {
                        const isTop = relativeIdx === 0;
                        
                        const offsetY = relativeIdx * 12;
                        const scale = 1 - relativeIdx * 0.04;
                        const zIndex = 20 - relativeIdx * 10;
                        
                        let transform = `translateY(${offsetY}px) scale(${scale})`;
                        let opacity = 1;
                        
                        if (isTop) {
                          if (exitDirection === 'right') {
                            transform = 'translate(120vw, 30px) rotate(20deg) scale(1)';
                            opacity = 0;
                          } else if (exitDirection === 'left') {
                            transform = 'translate(-120vw, 30px) rotate(-20deg) scale(1)';
                            opacity = 0;
                          } else {
                            transform = `translate(${dragOffset.x}px, ${dragOffset.y}px) rotate(${dragOffset.x * 0.08}deg) scale(1)`;
                          }
                        }

                        const positiveOpacity = isTop ? Math.min(Math.max(dragOffset.x / 75, 0), 1) : 0;
                        const negativeOpacity = isTop ? Math.min(Math.max(-dragOffset.x / 75, 0), 1) : 0;

                        return (
                          <div 
                            key={theme.id}
                            ref={isTop ? activeCardRef : null}
                            className={`absolute inset-0 bg-white border border-paper-300 rounded-2xl p-6 shadow-md overflow-hidden flex flex-col justify-between select-none touch-none ${
                              isTop ? 'cursor-grab active:cursor-grabbing' : 'pointer-events-none'
                            }`}
                            style={{
                              zIndex,
                              transform,
                              opacity,
                              transition: isTop && isDragging ? 'none' : 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease-out',
                            }}
                            onTouchStart={isTop ? onTouchStart : undefined}
                            onTouchMove={isTop ? onTouchMove : undefined}
                            onTouchEnd={isTop ? onTouchEnd : undefined}
                            onMouseDown={isTop ? onMouseDown : undefined}
                            onMouseMove={isTop ? onMouseMove : undefined}
                            onMouseUp={isTop ? onMouseUp : undefined}
                            onMouseLeave={isTop ? onMouseUp : undefined}
                          >
                            {isTop && (
                              <>
                                <div 
                                  className="absolute top-5 left-5 z-30 border-2 border-emerald-600 text-emerald-700 font-literary font-bold text-xs px-3 py-1 rounded-lg rotate-[-8deg] bg-white shadow-md pointer-events-none"
                                  style={{ opacity: positiveOpacity }}
                                >
                                  PASST GUT 👍
                                </div>
                                <div 
                                  className="absolute top-5 right-5 z-30 border-2 border-rose-600 text-rose-700 font-literary font-bold text-xs px-3 py-1 rounded-lg rotate-[8deg] bg-white shadow-md pointer-events-none"
                                  style={{ opacity: negativeOpacity }}
                                >
                                  LIEBER NICHT 👎
                                </div>
                              </>
                            )}

                            <div className="flex items-center space-x-3.5 border-b border-paper-200 pb-3.5">
                              <div className="w-12 h-12 rounded-xl bg-paper-100 border border-paper-300 flex items-center justify-center text-2xl shadow-inner flex-shrink-0">
                                {theme.icon}
                              </div>
                              <div>
                                <span className="inline-block px-2 py-0.5 bg-paper-200 text-ink-800 text-[10px] font-bold uppercase tracking-wider rounded">
                                  Motiv: {theme.category}
                                </span>
                                <h3 className="font-literary font-bold text-lg text-ink-900 leading-snug">
                                  {theme.title}
                                </h3>
                              </div>
                            </div>

                            <div className="bg-paper-50 border border-paper-200 p-4 rounded-xl space-y-1.5 flex-grow my-3 flex flex-col justify-start overflow-y-auto custom-scrollbar">
                              <span className="text-[10px] font-bold text-burgundy-700 uppercase tracking-wider block">
                                📜 Wie äußert sich das im Buch?
                              </span>
                              <p className="text-xs text-ink-800 leading-relaxed font-normal">
                                {theme.description}
                              </p>
                            </div>

                            <div className="text-center text-[11px] text-ink-800 font-bold uppercase tracking-wider pt-1">
                              Wische nach rechts für JA &bull; nach links für NEIN
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    <div className="flex items-center justify-center space-x-8 pt-2 z-40">
                      <button
                        onClick={() => handleDecision(false)}
                        className="w-14 h-14 rounded-full bg-white border border-rose-200 text-rose-600 hover:bg-rose-50 flex items-center justify-center text-lg shadow-sm transition transform active:scale-95"
                        title="Ablehnen"
                      >
                        ✕
                      </button>

                      <button
                        onClick={() => handleDecision(true)}
                        className="w-14 h-14 rounded-full bg-burgundy-700 hover:bg-burgundy-800 text-white flex items-center justify-center text-xl font-bold shadow-md transition transform active:scale-95"
                        title="Gefällt mir!"
                      >
                        ♥
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="my-auto text-center space-y-4">
                    <p className="text-ink-800 font-literary">Alle Motive durchgesehen.</p>
                    <button 
                      onClick={() => setStep(3)}
                      className="px-6 py-3 bg-burgundy-700 text-white font-literary font-bold rounded-xl shadow-md">
                      Zu deinen Buchempfehlungen
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* STEP 3: RECOMMENDATIONS */}
            {step === 3 && (
              <div key="step-3" className="step-transition space-y-6">
                <div className="text-center space-y-1.5">
                  <span className="inline-block px-3 py-0.5 bg-burgundy-50 border border-burgundy-100 text-burgundy-700 rounded-full text-xs font-semibold tracking-wide uppercase">
                    Schritt 3 von 3
                  </span>
                  <h2 className="font-literary text-2xl font-bold text-ink-900">
                    Deine Buch-Empfehlungen
                  </h2>
                </div>

                {isLoadingAi && (
                  <div className="bg-white border border-paper-300 rounded-2xl p-8 text-center space-y-6 shadow-md">
                    <div className="space-y-3">
                      <div className="text-3xl animate-bounce">📚</div>
                      <div className="min-h-[44px] flex items-center justify-center px-2">
                        <p className="font-literary text-ink-800 text-xs transition-all duration-300 leading-relaxed">
                          {LOADING_PHRASES[loadingPhraseIndex]}
                        </p>
                      </div>
                    </div>

                    <div className="space-y-2 max-w-xs mx-auto">
                      <div className="flex justify-between items-center text-xs font-medium text-ink-700">
                        <span>Katalogisierung...</span>
                        <span className="font-mono text-sm font-bold text-burgundy-700">{loadingProgress}%</span>
                      </div>
                      <div className="w-full h-2.5 bg-paper-200 rounded-full overflow-hidden border border-paper-300 p-0.5">
                        <div 
                          className="h-full bg-burgundy-700 rounded-full transition-all duration-300 ease-out shadow-sm"
                          style={{ width: `${loadingProgress}%` }}
                        ></div>
                      </div>
                    </div>
                  </div>
                )}

                {aiError && (
                  <div className="bg-rose-50 border border-rose-200 rounded-xl p-4 text-center space-y-3">
                    <p className="text-xs text-rose-800 font-medium">{aiError}</p>
                    <button
                      onClick={() => fetchAiBookRecommendations()}
                      className="px-4 py-2 bg-rose-700 hover:bg-rose-800 text-white text-xs font-literary font-bold rounded-lg shadow-sm"
                    >
                      Erneut versuchen
                    </button>
                  </div>
                )}

                {aiRecommendations && !isLoadingAi && (
                  <div className="space-y-5">
                    {aiRecommendations.summary && (
                      <div className="bg-paper-50 border border-paper-300 p-4 rounded-xl text-xs text-ink-800 font-literary leading-relaxed shadow-sm flex items-start space-x-3">
                        <span className="text-lg flex-shrink-0">📜</span>
                        <p>{aiRecommendations.summary}</p>
                      </div>
                    )}

                    <div className="space-y-4">
                      {aiRecommendations.books?.map((book, idx) => {
                        const fav = isFavorite(book);
                        const bookKey = `${book.title}-${book.author}`;
                        const isPopping = popHeartKey === bookKey;

                        return (
                          <div 
                            key={idx}
                            className="bg-white border border-paper-300 hover:border-burgundy-600/50 rounded-2xl p-5 shadow-md space-y-3 transition duration-200 relative"
                          >
                            <div className="flex items-start justify-between gap-3">
                              <div className="flex-grow">
                                <span className="text-[10px] font-bold text-burgundy-700 uppercase tracking-wider block">
                                  Empfehlung #{idx + 1} &bull; {book.genre} ({book.year})
                                </span>
                                <h3 className="font-literary font-bold text-lg text-ink-900 leading-tight mt-0.5">
                                  {book.title}
                                </h3>
                                <p className="text-xs text-ink-700 font-medium">
                                  von {book.author}
                                </p>
                              </div>

                              <button
                                onClick={() => toggleFavorite(book)}
                                className={`p-2.5 rounded-xl border transition-all duration-200 flex items-center justify-center flex-shrink-0 ${
                                  isPopping ? 'animate-heart-pop' : ''
                                } ${
                                  fav
                                    ? 'bg-burgundy-700 text-white border-burgundy-800 shadow-sm'
                                    : 'bg-paper-50 text-ink-700 border-paper-300 hover:border-burgundy-600/40 hover:text-burgundy-700'
                                }`}
                                title={fav ? "Aus Favoriten entfernen" : "Zu Favoriten hinzufügen"}
                              >
                                <HeartIcon filled={fav} className="w-5 h-5" />
                              </button>
                            </div>

                            <div className="bg-burgundy-50 border border-burgundy-100 p-3 rounded-xl text-xs text-burgundy-900 flex items-start space-x-2">
                              <span>🎯</span>
                              <span><strong>Warum es passt:</strong> {book.matchReason}</span>
                            </div>

                            <div className="bg-paper-50 border border-paper-200 p-3.5 rounded-xl space-y-1">
                              <span className="text-[10px] font-bold text-ink-700 uppercase tracking-wider block">
                                Klappentext
                              </span>
                              <p className="text-xs text-ink-800 leading-relaxed font-normal">
                                "{book.description}"
                              </p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                <div className="pt-2">
                  <button
                    onClick={() => {
                      setStep(1);
                      setAiRecommendations(null);
                    }}
                    className="w-full py-3 bg-white hover:bg-paper-50 text-ink-800 text-xs font-literary font-bold rounded-xl border border-paper-300 transition shadow-sm"
                  >
                    Neue Empfehlungen suchen
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* FAVORITES DRAWER */}
          {isFavoritesOpen && (
            <div 
              onClick={(e) => { if (e.target === e.currentTarget) handleCloseDrawer(); }}
              className={`fixed inset-0 z-50 flex justify-end bg-ink-950/40 backdrop-blur-sm ${
                isDrawerClosing ? 'opacity-0 transition-opacity duration-300' : 'animate-backdrop-in'
              }`}
            >
              <div 
                className={`bg-paper-100 w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-5 border-l border-paper-300 overflow-hidden ${
                  isDrawerClosing ? 'animate-drawer-out' : 'animate-drawer-in'
                }`}
              >
                <div className="flex items-center justify-between pb-4 border-b border-paper-300">
                  <div className="flex items-center space-x-2">
                    <span className="text-xl">📚</span>
                    <div>
                      <h2 className="font-literary font-bold text-lg text-ink-900">Deine Favoriten</h2>
                      <p className="text-[10px] text-burgundy-700 font-semibold uppercase tracking-wider">
                        {favorites.length} {favorites.length === 1 ? 'Gespeichertes Buch' : 'Gespeicherte Bücher'}
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={handleCloseDrawer}
                    className="w-8 h-8 rounded-full bg-paper-200 hover:bg-paper-300 text-ink-800 font-bold flex items-center justify-center transition active:scale-95"
                  >
                    ✕
                  </button>
                </div>

                {favorites.length > 0 && (
                  <div className="my-3 space-y-2">
                    <button
                      onClick={handleShareFavorites}
                      className="w-full py-2.5 px-3 bg-burgundy-700 hover:bg-burgundy-800 text-white text-xs font-medium rounded-xl shadow-sm flex items-center justify-center space-x-2 transition active:scale-95"
                    >
                      <ShareIcon className="w-4 h-4" />
                      <span>Favoriten-Liste teilen / kopieren</span>
                    </button>
                    {copyNotice && (
                      <p className="text-[11px] text-emerald-800 bg-emerald-50 border border-emerald-200 p-1.5 rounded-lg text-center font-medium transition">
                        ✓ {copyNotice}
                      </p>
                    )}
                  </div>
                )}

                <div className="bg-amber-50/80 border border-amber-200 p-3 rounded-xl my-1 text-[11px] text-amber-900 flex items-start space-x-2 leading-relaxed">
                  <span className="text-sm flex-shrink-0">ℹ️</span>
                  <p>
                    <strong>Hinweis:</strong> Deine Favoriten werden im Browser gespeichert und gehen verloren, wenn du Browserdaten (z. B. Cookies) löschst.
                  </p>
                </div>

                <div className="flex-grow overflow-y-auto space-y-3 custom-scrollbar my-2 pr-1">
                  {favorites.length === 0 ? (
                    <div className="text-center py-12 space-y-2">
                      <div className="text-3xl opacity-50">💔</div>
                      <p className="font-literary text-sm text-ink-800 font-medium">Noch keine Favoriten gespeichert.</p>
                      <p className="text-xs text-ink-700 max-w-xs mx-auto">
                        Tippe bei Empfehlungen auf das Herz-Symbol, um Bücher in deine persönliche Merkliste aufzunehmen.
                      </p>
                    </div>
                  ) : (
                    favorites.map((book, idx) => (
                      <div 
                        key={idx}
                        className="bg-white border border-paper-300 rounded-xl p-3.5 shadow-sm space-y-2 relative transition hover:border-burgundy-600/30"
                      >
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <span className="text-[10px] font-bold text-burgundy-700 uppercase tracking-wider block">
                              {book.genre} ({book.year})
                            </span>
                            <h4 className="font-literary font-bold text-sm text-ink-900 leading-tight">
                              {book.title}
                            </h4>
                            <p className="text-xs text-ink-700 font-medium">
                              von {book.author}
                            </p>
                          </div>
                          <button
                            onClick={() => toggleFavorite(book)}
                            className="text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg text-xs font-bold transition flex-shrink-0 active:scale-95"
                            title="Aus Favoriten entfernen"
                          >
                            ✕
                          </button>
                        </div>

                        {book.matchReason && (
                          <p className="text-[11px] text-burgundy-900 bg-burgundy-50 p-2 rounded-lg">
                            🎯 {book.matchReason}
                          </p>
                        )}
                      </div>
                    ))
                  )}
                </div>

                <div className="pt-3 border-t border-paper-300">
                  <button
                    onClick={handleCloseDrawer}
                    className="w-full py-2.5 bg-ink-900 hover:bg-ink-950 text-paper-50 text-xs font-literary font-bold rounded-xl transition shadow-sm active:scale-98"
                  >
                    Schließen
                  </button>
                </div>

              </div>
            </div>
          )}

          <footer className="bg-paper-50 border-t border-paper-300 py-3.5 text-center text-[11px] text-ink-700 font-literary">
            BuchKompass &bull; Bene 2026
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
