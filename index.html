      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 38, 62, 0.65);
    }

    @keyframes fadeInSmooth {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes heartPop {
      0% { transform: scale(1); }
      30% { transform: scale(1.45) rotate(-12deg); }
      60% { transform: scale(0.85) rotate(8deg); }
      80% { transform: scale(1.15) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes drawerSlideIn {
      0% { transform: translateX(100%); }
      100% { transform: translateX(0); }
    }

    @keyframes drawerSlideOut {
      0% { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    @keyframes backdropFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes toastFade {
      0% { opacity: 0; transform: translate(-50%, -12px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -12px); }
    }

    /* Animationen: Schreibmaschine & Magische Aura */
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes magicAura {
      0%, 100% {
        transform: scale(0.96) rotate(0deg);
        opacity: 0.55;
        filter: blur(24px);
      }
      50% {
        transform: scale(1.08) rotate(3deg);
        opacity: 0.85;
        filter: blur(36px);
      }
    }

    .animate-cursor {
      animation: cursorBlink 0.75s infinite;
    }

    .animate-aura {
      animation: magicAura 3s ease-in-out infinite;
    }

    .step-transition {
      animation: fadeInSmooth 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-heart-pop {
      animation: heartPop 0.48s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .animate-drawer-in {
      animation: drawerSlideIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-drawer-out {
      animation: drawerSlideOut 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-backdrop-in {
      animation: backdropFadeIn 0.35s ease-out forwards;

      { id: 'st-ip2', genreIds: ['historisch'], icon: '🏭', category: 'Industrie', title: 'Zeiten des Umbruchs', description: 'Der dramatische Aufstieg neuer Industriezweige im 19. und 20. Jahrhundert, das Entstehen von Großstädten und das Aufeinanderprallen von traditionellem Handwerk mit dem Maschinenzeitalter.' },

      { id: 'st-j1', genreIds: ['jugend'], icon: '🌱', category: 'Entwicklung', title: 'Identität & Erwachen', description: 'Einfühlsame Geschichten über das Heranwachsen, die schwierige Abgrenzung vom Elternhaus, erste schmerzhafte Enttäuschungen und das mutige Suchen nach dem eigenen Platz in der Welt.' },
      { id: 'st-j2', genreIds: ['jugend'], icon: '🏫', category: 'Schulalltag', title: 'Internat & Dynamiken', description: 'Freundschaften, Zusammenhalt und Rivalitäten in Schulen oder Internaten. Geheimnisse hinter dicken Schulmauern und gemeinsame Abenteuer prägen die Schulzeit.' },
      { id: 'st-j3', genreIds: ['jugend'], icon: '⚡', category: 'Zusammenhalt', title: 'Gemeinsame Mutproben', description: 'Eine Gruppe jugendlicher Freunde gerät in ein unvorhergesehenes Abenteuer und muss zusammenhalten, um Gefahren zu meistern und einander bedingungslos zu vertrauen.' },
      { id: 'st-j4', genreIds: ['jugend'], icon: '💬', category: 'Gefühle', title: 'Erste große Liebe', description: 'Das unbeschreibliche Gefühl des ersten echten Herzklopfens, chaotische Emotionen, Unsicherheiten und die Magie unverfälschter Begegnungen beim Erwachsenwerden.' },
      { id: 'st-j5', genreIds: ['jugend'], icon: '⛺', category: 'Freiheit', title: 'Unvergesslicher Sommer', description: 'Spontane Roadtrips, lange Sommernächte und Ferientage voller Leichtigkeit, die das Leben der Beteiligten nachhaltig verändern und unvergessliche Erinnerungen schaffen.' },
      { id: 'st-j6', genreIds: ['jugend'], icon: '🎸', category: 'Ausdruck', title: 'Kreativität & Bandleben', description: 'Musik machen, Schreiben oder Zeichnen als wichtiges Ventil für eigene Emotionen. Zusammen an einem Ziel arbeiten, Bühnen erobern und die eigene Stimme finden.' }
    ];

    const LOADING_PHRASES = [
      '👻 Büchergeister werden freundlich gebeten zu weichen...',
      '⚜️ Geheime Privatsammlungen werden durchforstet...',
      '🔖 Erstausgaben werden durchgesehen...',
      '🕯️ Dachbodenfunde werden gesichtet...',
      '🏛️ Verlagsregister werden konsultiert...',
      '👩🏼‍💻 Erfahrene Lektoren werden befragt...',
    ];

    const POPULAR_GENRES = [
      { id: 'fantasy', name: 'Fantasy' },
      { id: 'romantasy', name: 'Romantasy' },
      { id: 'thriller', name: 'Krimi & Thriller' },
      { id: 'scifi', name: 'Science Fiction' },
      { id: 'romance', name: 'Romantik' },
      { id: 'humor', name: 'Humor & Satire' },
      { id: 'sachbuch', name: 'Sachbuch' },
      { id: 'historisch', name: 'Historische Romane' },
      { id: 'jugend', name: 'Jugendbuch' },
      { id: 'belletristik', name: 'Belletristik' }
    ];

    const RARE_GENRES = [
      { id: 'cozy_crime', name: 'Cozy Crime' },
      { id: 'dark_romance', name: 'Dark Romance 🔥' },
      { id: 'new_adult', name: 'New Adult' },
      { id: 'memoir', name: 'Biografien' },
      { id: 'graphic_novels', name: 'Graphic Novels' },
      { id: 'modern_poetry', name: 'Moderne Poesie' }
    ];

    const MOODS = [
      'Fesselnd & Hochspannung',
      'Gemütlich & Herzerwärmend',
      'Düster & Atmosphärisch',
      'Tiefgründig & Nachdenklich',
      'Amüsant & Locker'
    ];

    const LENGTHS = ['Egal', 'Kurz (< 300 S.)', 'Mittel (300-500 S.)', 'Wälzer (> 500 S.)'];

    const ERA_OPTIONS = ['Egal', 'Vor 2000', 'Nach 2000', 'Nach 2015'];

    function App() {
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [visitorCount, setVisitorCount] = useState(null);

      useEffect(() => {
        fetch('/api/config')
          .then(res => res.json())
          .then(async cfg => {
            if (cfg.url && cfg.key && window.supabase) {
              const client = window.supabase.createClient(cfg.url, cfg.key);
              setSupabaseClient(client);

              try {
                const storageKey = 'buchkompass_user_counted';
                const hasBeenCounted = localStorage.getItem(storageKey);

                if (!hasBeenCounted) {
                  const { data: currentData } = await client.from('visitors').select('count').eq('id', 1).single();
                  const newCount = (currentData ? currentData.count : 0) + 1;
                  
                  await client.from('visitors').upsert({ id: 1, count: newCount });
                  setVisitorCount(newCount);
                  localStorage.setItem(storageKey, 'true');
                } else {
                  const { data: currentData } = await client.from('visitors').select('count').eq('id', 1).single();
                  if (currentData) {
                    setVisitorCount(currentData.count);
                  }
                }
              } catch (e) {
                console.error("Fehler beim Besucherzähler:", e);
              }
            }
          })
          .catch(err => console.error("Konnte Supabase Config nicht abrufen:", err));
      }, []);

      const [step, setStep] = useState(1);
      const [typewriterText, setTypewriterText] = useState('');
      const [showCursor, setShowCursor] = useState(true);
      const fullHeadline = "Was möchtest du lesen?";

      useEffect(() => {
        if (step === 1) {
          setTypewriterText('');
          setShowCursor(true);
          let index = 0;
          let cursorTimeout;
          const timer = setInterval(() => {
            if (index < fullHeadline.length) {
              setTypewriterText(fullHeadline.substring(0, index + 1));
              index++;
            } else {
              clearInterval(timer);
              // Nach Satzende genau 3-mal blinken lassen (3 * 0.75s = 2250ms)
              cursorTimeout = setTimeout(() => {
                setShowCursor(false);
              }, 2250);
            }
          }, 65);
          return () => {
            clearInterval(timer);
            if (cursorTimeout) clearTimeout(cursorTimeout);
          };
        }
      }, [step]);

      const [selectedGenres, setSelectedGenres] = useState(['fantasy']);
      const [selectedMoods, setSelectedMoods] = useState([MOODS[0]]);
      const [selectedLength, setSelectedLength] = useState('Egal');
      const [selectedEra, setSelectedEra] = useState('Egal');

      const [themesToSwipe, setThemesToSwipe] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [likedThemes, setLikedThemes] = useState([]);
      const [dislikedThemes, setDislikedThemes] = useState([]);

      const [sessionShownBooks, setSessionShownBooks] = useState([]);
      const [showToast, setShowToast] = useState(false);

      const [exitDirection, setExitDirection] = useState(null);
      const [isAnimatingExit, setIsAnimatingExit] = useState(false);

      const [reportingBook, setReportingBook] = useState(null);
      const [techInfoBook, setTechInfoBook] = useState(null);
      const [searchModalBook, setSearchModalBook] = useState(null);
      const [selectedReasons, setSelectedReasons] = useState([]);
      const [reportComment, setReportComment] = useState('');
      const [isSubmittingReport, setIsSubmittingReport] = useState(false);
      const [reportSuccess, setReportSuccess] = useState(false);

      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem('buchtinder_favorites');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [alreadyRead, setAlreadyRead] = useState(() => {
        try {
          const saved = localStorage.getItem('buchtinder_already_read');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [isFavoritesOpen, setIsFavoritesOpen] = useState(false);
      const [drawerTab, setDrawerTab] = useState('favorites');
      const [isDrawerClosing, setIsDrawerClosing] = useState(false);
      const [popHeartKey, setPopHeartKey] = useState(null);
      const [popBookKey, setPopBookKey] = useState(null);
      const [copyNotice, setCopyNotice] = useState('');

      const activeCardRef = useRef(null);

      useEffect(() => {
        const card = activeCardRef.current;
        if (!card) return;
        const preventPageScroll = (e) => {
          if (e.cancelable) e.preventDefault();
        };
        card.addEventListener('touchmove', preventPageScroll, { passive: false });
        return () => {
          card.removeEventListener('touchmove', preventPageScroll);
        };
      }, [step, currentIndex]);

      useEffect(() => {
        if (isFavoritesOpen || reportingBook || techInfoBook || searchModalBook) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => {
          document.body.style.overflow = '';
        };
      }, [isFavoritesOpen, reportingBook, techInfoBook, searchModalBook]);

      useEffect(() => {
        try {
          localStorage.setItem('buchtinder_favorites', JSON.stringify(favorites));
        } catch (e) {}
      }, [favorites]);

      useEffect(() => {
        try {
          localStorage.setItem('buchtinder_already_read', JSON.stringify(alreadyRead));
        } catch (e) {}
      }, [alreadyRead]);

      const toggleFavorite = (book) => {
        const bookKey = `${book.title}-${book.author}`;
        setPopHeartKey(bookKey);
        setTimeout(() => setPopHeartKey(null), 500);

        setFavorites(prev => {
          const exists = prev.some(f => f.title === book.title && f.author === book.author);
          if (exists) {
            return prev.filter(f => !(f.title === book.title && f.author === book.author));
          } else {
            return [...prev, book];
          }
        });
      };

      const toggleAlreadyRead = (book) => {
        const bookKey = `${book.title}-${book.author}`;
        setPopBookKey(bookKey);
        setTimeout(() => setPopBookKey(null), 500);

        setAlreadyRead(prev => {
          const exists = prev.some(f => f.title === book.title && f.author === book.author);
          if (exists) {
            return prev.filter(f => !(f.title === book.title && f.author === book.author));
          } else {
            return [...prev, book];
          }
        });
      };

      const isFavorite = (book) => favorites.some(f => f.title === book.title && f.author === book.author);
      const isAlreadyRead = (book) => alreadyRead.some(f => f.title === book.title && f.author === book.author);

      const handleCloseDrawer = () => {
        setIsDrawerClosing(true);
        setTimeout(() => {
          setIsFavoritesOpen(false);
          setIsDrawerClosing(false);
        }, 300);
      };

      const handleShareFavorites = () => {
        if (favorites.length === 0) return;
        const formattedList = favorites.map((b, i) => `${i + 1}. "${b.title}" von ${b.author} (${b.genre})`).join('\n');
        const text = `📚 Meine Buch-Favoriten auf BuchKompass:\n\n${formattedList}\n\nFinde deinen nächsten Bestseller: https://buchkompass.benedrive.de!`;

        if (navigator.share) {
          navigator.share({ title: 'Meine BuchKompass-Favoriten', text: text }).catch(() => {});
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          setCopyNotice('Text in Zwischenablage kopiert!');
          setTimeout(() => setCopyNotice(''), 3000);
        }
      };

      const toggleGenre = (genreId) => {
        setSelectedGenres(prev => {
          if (prev.includes(genreId)) {
            if (prev.length === 1) return prev;
            return prev.filter(id => id !== genreId);
          } else {
            return [...prev, genreId];
          }
        });
      };

      const handleRareGenreSelect = (e) => {
        const val = e.target.value;
        if (!val) return;
        if (!selectedGenres.includes(val)) {
          setSelectedGenres(prev => [...prev, val]);
        }
        e.target.value = "";
      };

      const toggleMood = (mood) => {
        setSelectedMoods(prev => {
          if (prev.includes(mood)) {
            if (prev.length === 1) return prev;
            return prev.filter(m => m !== mood);
          } else {
            return [...prev, mood];
          }
        });
      };

      const handleToggleReportReason = (reason) => {
        setSelectedReasons(prev => 
          prev.includes(reason) ? prev.filter(r => r !== reason) : [...prev, reason]
        );
      };

      const handleSubmitReport = async () => {
        if (!reportingBook || (selectedReasons.length === 0 && !reportComment.trim())) return;
        setIsSubmittingReport(true);

        try {
          let client = supabaseClient;
          if (!client) {
            const res = await fetch('/api/config');
            const cfg = await res.json();
            if (cfg.url && cfg.key && window.supabase) {
              client = window.supabase.createClient(cfg.url, cfg.key);
              setSupabaseClient(client);
            }
          }

          if (client) {
            const { error } = await client.from('reports').insert([{
              book_title: reportingBook.title,
              book_author: reportingBook.author,
              book_isbn: reportingBook.isbn || null,
              reasons: selectedReasons,
              comment: reportComment.trim() || null
            }]);
            if (error) throw error;
          }

          setReportSuccess(true);
          setTimeout(() => {
            setReportingBook(null);
            setSelectedReasons([]);
            setReportComment('');
            setReportSuccess(false);
          }, 1800);
        } catch (err) {
          alert("Fehler beim Absenden der Meldung.");
        } finally {
          setIsSubmittingReport(false);
        }
      };

      const [aiRecommendations, setAiRecommendations] = useState(null);
      const [isLoadingAi, setIsLoadingAi] = useState(false);
      const [isReloading, setIsReloading] = useState(false);
      const [aiError, setAiError] = useState('');
      const [loadingProgress, setLoadingProgress] = useState(0);
      const [loadingPhraseIndex, setLoadingPhraseIndex] = useState(0);

      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const dragStart = useRef({ x: 0, y: 0 });

      const startSwipingThemes = () => {
        setSessionShownBooks([]);

        let matchingThemes = STORY_THEMES.filter(st => 
          st.genreIds.some(gId => selectedGenres.includes(gId))
        );

        if (matchingThemes.length < 12) {
          const remaining = STORY_THEMES.filter(st => !matchingThemes.some(m => m.id === st.id));
          const needed = 12 - matchingThemes.length;
          const extra = remaining.sort(() => 0.5 - Math.random()).slice(0, needed);
          matchingThemes = [...matchingThemes, ...extra];
        }

        const finalSelection = matchingThemes
          .sort(() => 0.5 - Math.random())
          .slice(0, 12);

        setThemesToSwipe(finalSelection);
        setCurrentIndex(0);
        setLikedThemes([]);
        setDislikedThemes([]);
        setExitDirection(null);
        setIsAnimatingExit(false);
        setStep(2);
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2800);
      };

      const handleDecision = (liked) => {
        if (currentIndex >= themesToSwipe.length || isAnimatingExit) return;

        setIsAnimatingExit(true);
        setExitDirection(liked ? 'right' : 'left');

        setTimeout(() => {
          const currentTheme = themesToSwipe[currentIndex];
          const newLiked = liked ? [...likedThemes, currentTheme] : likedThemes;
          const newDisliked = !liked ? [...dislikedThemes, currentTheme] : dislikedThemes;

          if (liked) setLikedThemes(newLiked);
          else setDislikedThemes(newDisliked);

          setDragOffset({ x: 0, y: 0 });
          setExitDirection(null);
          setIsAnimatingExit(false);

          if (currentIndex + 1 >= themesToSwipe.length) {
            setStep(3);
            fetchAiBookRecommendations(newLiked, newDisliked, false, false);
          } else {
            setCurrentIndex(prev => prev + 1);
          }
        }, 280);
      };

      const fetchAiBookRecommendations = async (likedList = likedThemes, dislikedList = dislikedThemes, excludeAlreadyRead = false, isReload = false) => {
        if (isReload) {
          setIsReloading(true);
        } else {
          setIsLoadingAi(true);
        }
        setAiError('');
        setLoadingProgress(0);
        setLoadingPhraseIndex(0);

        const startTime = Date.now();
        const DURATION = 10000;

        let progressInterval, phraseInterval;

        if (!isReload) {
          progressInterval = setInterval(() => {
            const elapsedTime = Date.now() - startTime;
            const progress = Math.min(Math.floor((elapsedTime / DURATION) * 100), 100);
            setLoadingProgress(progress);
          }, 50);

          phraseInterval = setInterval(() => {
            setLoadingPhraseIndex(prev => (prev + 1) % LOADING_PHRASES.length);
          }, 1750);
        }

        try {
          let client = supabaseClient;
          if (!client) {
            const res = await fetch('/api/config');
            const cfg = await res.json();
            if (cfg.url && cfg.key && window.supabase) {
              client = window.supabase.createClient(cfg.url, cfg.key);
              setSupabaseClient(client);
            } else {
              throw new Error("Umgebungsvariablen fehlen oder sind leer.");
            }
          }

          let query = client.from('books').select('*');

          if (selectedGenres.length > 0) {
            query = query.in('genre', selectedGenres);
          }
          if (selectedLength !== 'Egal') {
            query = query.eq('length', selectedLength);
          }
          if (selectedEra !== 'Egal') {
            query = query.eq('era', selectedEra);
          }

          if (likedList.length > 0) {
            const likedIds = likedList.map(t => t.id); 
            query = query.overlaps('theme_ids', likedIds);
          }

          if (excludeAlreadyRead && alreadyRead.length > 0) {
            const excludeIsbns = alreadyRead.map(b => b.isbn).filter(Boolean);
            if (excludeIsbns.length > 0) {
              query = query.not('isbn', 'in', `(${excludeIsbns.join(',')})`);
            }
          }

          if (sessionShownBooks.length > 0) {
            const shownIsbns = sessionShownBooks.map(b => b.isbn).filter(Boolean);
            if (shownIsbns.length > 0) {
              query = query.not('isbn', 'in', `(${shownIsbns.join(',')})`);
            }
          }

          const { data, error } = await query;

          if (error) throw error;

          let filteredBooks = data || [];

          if (filteredBooks.length === 0 && likedList.length > 0) {
            let retryQuery = client.from('books').select('*');
            if (selectedGenres.length > 0) retryQuery = retryQuery.in('genre', selectedGenres);
            if (selectedLength !== 'Egal') retryQuery = retryQuery.eq('length', selectedLength);
            if (selectedEra !== 'Egal') retryQuery = retryQuery.eq('era', selectedEra);
            const retryRes = await retryQuery;
            
            let retryBooks = retryRes.data || [];
            if (sessionShownBooks.length > 0) {
              const shownIsbns = sessionShownBooks.map(b => b.isbn).filter(Boolean);
              retryBooks = retryBooks.filter(b => !shownIsbns.includes(b.isbn));
            }
            filteredBooks = retryBooks;
          }

          if (filteredBooks.length === 0) {
            if (progressInterval) clearInterval(progressInterval);
            if (phraseInterval) clearInterval(phraseInterval);
            setAiError("Noch mehr Bücher, die deiner Anfrage entsprechen, konnte der Bibliothekar nicht finden. Probiere ein anderes Genre.");
            setAiRecommendations({ books: [] });
            return;
          }

          if (selectedMoods.length > 0) {
            const moodMatched = filteredBooks.filter(book => 
              Array.isArray(book.moods) && book.moods.some(m => selectedMoods.includes(m))
            );
            if (moodMatched.length > 0) {
              filteredBooks = moodMatched;
            }
          }

          const shuffled = filteredBooks.sort(() => 0.5 - Math.random());
          const selectedBooks = shuffled.slice(0, 4).map(b => ({
            id: b.id || 'db-internal-unknown',
            title: b.title,
            author: b.author,
            year: b.year,
            genre: b.genre,
            length: b.length,
            era: b.era,
            moods: b.moods || [],
            theme_ids: b.theme_ids || [],
            description: b.description,
            matchReason: b.match_reason || "Enthält deine gewünschten Handlungs-Motive.",
            isbn: b.isbn
          }));

          setSessionShownBooks(prev => [...prev, ...selectedBooks]);

          if (!isReload) {
            const elapsedSoFar = Date.now() - startTime;
            const remainingTime = Math.max(DURATION - elapsedSoFar, 0);
            await new Promise(r => setTimeout(r, remainingTime));
            setLoadingProgress(100);
            await new Promise(r => setTimeout(r, 250));
          }

          setAiRecommendations({ books: selectedBooks });

        } catch (err) {
          console.error("Supabase Error:", err);
          setAiError(`Fehler beim Laden der Bücher aus Supabase.`);
          setAiRecommendations({ books: [] });
        } finally {
          if (progressInterval) clearInterval(progressInterval);
          if (phraseInterval) clearInterval(phraseInterval);
          setIsLoadingAi(false);
          setIsReloading(false);
        }
      };

      const onTouchStart = (e) => {
        if (isAnimatingExit) return;
        setIsDragging(true);
        const touch = e.touches[0];
        dragStart.current = { x: touch.clientX, y: touch.clientY };
      };

      const onTouchMove = (e) => {
        if (!isDragging || isAnimatingExit) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - dragStart.current.x;
        const deltaY = touch.clientY - dragStart.current.y;
        setDragOffset({ x: deltaX, y: deltaY });
      };

      const onTouchEnd = () => {
        if (!isDragging || isAnimatingExit) return;
        setIsDragging(false);
        if (dragOffset.x > 75) handleDecision(true);
        else if (dragOffset.x < -75) handleDecision(false);
        else setDragOffset({ x: 0, y: 0 });

        setDragOffset({ x: deltaX, y: deltaY });

        setIsDragging(false);

                    </button>

                    <button
                      onClick={() => {
                        setStep(1);
                        setAiRecommendations(null);
                      }}
                      className="w-full py-3 bg-white hover:bg-paper-50 text-ink-800 text-xs font-literary font-bold rounded-xl border border-paper-300 transition shadow-sm active:scale-[0.98]"
                    >
                      Neue Suche starten
                    </button>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* SEARCH MODAL */}
          {searchModalBook && (
            <div 
              onClick={(e) => { if (e.target === e.currentTarget) setSearchModalBook(null); }}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink-950/40 backdrop-blur-sm animate-backdrop-in"
            >
              <div className="bg-white border border-paper-300 rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4">
                <div className="flex items-start justify-between pb-3">
                  <div>
                    <span className="text-[10px] font-bold text-burgundy-700 uppercase tracking-wider block">Händler-Auswahl</span>
                    <h3 className="font-literary font-bold text-base text-ink-900 leading-tight">{searchModalBook.title}</h3>
                    <p className="text-xs text-ink-700">von {searchModalBook.author}</p>
                  </div>
                  <button 
                    onClick={() => setSearchModalBook(null)}
                    className="text-ink-700 hover:text-ink-900 font-bold text-sm p-1"
                  >
                    ✕
                  </button>
                </div>

                <p className="text-xs text-ink-800 font-medium">Wo möchtest du nach diesem Buch suchen?</p>

                <div className="space-y-2 pt-1">
                  <a
                    href={`https://www.google.com/search?q=${encodeURIComponent(searchModalBook.title + ' ' + searchModalBook.author + ' Buch')}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-3 px-4 rounded-xl bg-blue-50 hover:bg-blue-100 border border-blue-200 text-xs font-bold text-blue-900 flex items-center justify-between transition active:scale-98 shadow-2xs"
                  >
                    <span>Google</span>
                    <span>🔍</span>
                  </a>

                  <a
                    href={`https://www.thalia.de/suche?sq=${encodeURIComponent(searchModalBook.title + ' ' + searchModalBook.author)}&stype=top`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-3 px-4 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-xs font-bold text-emerald-900 flex items-center justify-between transition active:scale-98 shadow-2xs"
                  >
                    <span>Thalia</span>
                    <span>🔍</span>
                  </a>

                  <a
                    href={`https://www.osiander.de/suche?sq=${encodeURIComponent(searchModalBook.title + ' ' + searchModalBook.author)}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-3 px-4 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-xs font-bold text-rose-900 flex items-center justify-between transition active:scale-98 shadow-2xs"
                  >
                    <span>Osiander</span>
                    <span>🔍</span>
                  </a>

                  <a
                    href={`https://www.amazon.de/s?k=${encodeURIComponent(searchModalBook.title + ' ' + searchModalBook.author)}&i=stripbooks`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-3 px-4 rounded-xl bg-gray-100 hover:bg-gray-200 border border-gray-300 text-xs font-bold text-gray-800 flex items-center justify-between transition active:scale-98 shadow-2xs"
                  >
                    <span>Amazon 👎🏻</span>
                    <span>🔍</span>
                  </a>
                </div>

                <div className="bg-paper-50 border border-paper-200 p-3 rounded-xl text-[11px] text-ink-700 leading-relaxed text-center">
                  ℹ️ BuchKompass erhält keine Provision und schützt deine Daten nach Zero-Knowledge-Standard.
                </div>

                <div className="pt-1">
                  <button
                    onClick={() => setSearchModalBook(null)}
                    className="w-full py-2.5 bg-paper-100 hover:bg-paper-200 text-ink-800 text-xs font-bold rounded-xl border border-paper-300 transition"
                  >
                    Schließen
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TECH INFO MODAL */}
          {techInfoBook && (
            <div 
              onClick={(e) => { if (e.target === e.currentTarget) setTechInfoBook(null); }}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink-950/40 backdrop-blur-sm animate-backdrop-in"
            >
              <div className="bg-white border border-paper-300 rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4 max-h-[90vh] flex flex-col justify-between">
                <div className="space-y-3 overflow-y-auto custom-scrollbar pr-1">
                  <div className="flex items-start justify-between pb-3">
                    <div>
                      <span className="text-[10px] font-bold text-burgundy-700 uppercase tracking-wider block">Empfehlungs-Analyse</span>
                      <h3 className="font-literary font-bold text-base text-ink-900 leading-tight">{techInfoBook.title}</h3>
                      <p className="text-xs text-ink-700">von {techInfoBook.author}</p>
                    </div>
                    <button 
                      onClick={() => setTechInfoBook(null)}
                      className="text-ink-700 hover:text-ink-900 font-bold text-sm p-1"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-3 text-xs text-ink-800">
                    <div className="bg-paper-50 border border-paper-200 p-3 rounded-xl space-y-1">
                      <p className="font-bold text-ink-900 uppercase tracking-wider text-[10px] pb-1">📊 Datenbank-Metadaten</p>
                      <div className="space-y-1.5 pt-0.5">
                        <div className="flex items-center justify-between bg-white border border-paper-300 px-2.5 py-1.5 rounded-lg">
                          <span className="text-ink-700 font-medium">DB-ID</span>
                          <code className="bg-paper-200 px-1.5 py-0.5 rounded text-[11px] font-mono text-ink-900">{techInfoBook.id}</code>
                        </div>
                        <div className="flex items-center justify-between bg-white border border-paper-300 px-2.5 py-1.5 rounded-lg">
                          <span className="text-ink-700 font-medium">ISBN</span>
                          <code className="bg-paper-200 px-1.5 py-0.5 rounded text-[11px] font-mono text-ink-900">{techInfoBook.isbn || 'Nicht hinterlegt'}</code>
                        </div>
                        <div className="flex items-center justify-between bg-white border border-paper-300 px-2.5 py-1.5 rounded-lg">
                          <span className="text-ink-700 font-medium">Genre</span>
                          <span className="inline-block px-2 py-0.5 bg-paper-200 text-ink-800 text-[11px] font-semibold rounded-md border border-paper-300">{techInfoBook.genre}</span>
                        </div>
                        <div className="flex items-center justify-between bg-white border border-paper-300 px-2.5 py-1.5 rounded-lg">
                          <span className="text-ink-700 font-medium">Umfang</span>
                          <span className="inline-block px-2 py-0.5 bg-paper-200 text-ink-800 text-[11px] font-semibold rounded-md border border-paper-300">{techInfoBook.length}</span>
                        </div>
                        <div className="flex items-center justify-between bg-white border border-paper-300 px-2.5 py-1.5 rounded-lg">
                          <span className="text-ink-700 font-medium">Erschienen</span>
                          <span className="inline-block px-2 py-0.5 bg-paper-200 text-ink-800 text-[11px] font-semibold rounded-md border border-paper-300">{techInfoBook.era}</span>
                        </div>
                      </div>
                    </div>

                    <div className="bg-burgundy-50 border border-burgundy-100 p-3 rounded-xl space-y-1">
                      <p className="font-bold text-burgundy-900 uppercase tracking-wider text-[10px] pb-1">🗳️ Motive & Stimmung</p>
                      <p className="text-[11px] font-medium text-burgundy-800">Verknüpfte Motive:</p>
                      <div className="flex flex-col gap-1.5 pt-0.5">
                        {techInfoBook.theme_ids && techInfoBook.theme_ids.length > 0 ? (
                          techInfoBook.theme_ids.map((tId, idx) => (
                            <div key={idx} className="flex items-center justify-between bg-white border border-burgundy-200 px-2.5 py-1.5 rounded-lg text-[11px] font-medium text-burgundy-900">
                              <span>{getThemeTitle(tId)}</span>
                              <code className="bg-burgundy-100 text-burgundy-900 px-1.5 py-0.5 rounded text-[10px] font-mono">
                                {tId}
                              </code>
                            </div>
                          ))
                        ) : (
                          <span className="text-ink-700 italic">Keine expliziten Motive verknüpft</span>
                        )}
                      </div>

                      <p className="pt-2 text-[11px] font-medium text-burgundy-800">Stimmung:</p>
                      <div className="flex items-center justify-between bg-white border border-burgundy-200 px-2.5 py-1.5 rounded-lg text-[11px] font-medium text-burgundy-900 mt-1">
                        <span>{techInfoBook.moods && techInfoBook.moods.length > 0 ? techInfoBook.moods.join(', ') : 'Standard'}</span>
                        <code className="bg-burgundy-100 text-burgundy-900 px-1.5 py-0.5 rounded text-[10px] font-mono">mood</code>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="pt-3">
                  <button
                    onClick={() => setTechInfoBook(null)}
                    className="w-full py-2.5 bg-ink-900 hover:bg-ink-950 text-paper-50 text-xs font-bold rounded-xl transition shadow-sm"
                  >
                    Schließen
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* REPORT MODAL */}
          {reportingBook && (
            <div 
              onClick={(e) => { if (e.target === e.currentTarget) setReportingBook(null); }}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink-950/40 backdrop-blur-sm animate-backdrop-in"
            >
              <div className="bg-white border border-paper-300 rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4 max-h-[90vh] flex flex-col justify-between">
                
                {reportSuccess ? (
                  <div className="py-8 text-center space-y-2">
                    <div className="text-4xl">✅</div>
                    <h3 className="font-literary font-bold text-lg text-ink-900">Vielen Dank!</h3>
                    <p className="text-xs text-ink-700">Deine Meldung wurde erfolgreich gespeichert.</p>
                  </div>
                ) : (
                  <>
                    <div className="space-y-3 overflow-y-auto custom-scrollbar pr-1">
                      <div className="flex items-start justify-between pb-3">
                        <div>
                          <span className="text-[10px] font-bold text-rose-700 uppercase tracking-wider block">Eintrag melden</span>
                          <h3 className="font-literary font-bold text-base text-ink-900 leading-tight">{reportingBook.title}</h3>
                          <p className="text-xs text-ink-700">von {reportingBook.author}</p>
                        </div>
                        <button 
                          onClick={() => setReportingBook(null)}
                          className="text-ink-700 hover:text-ink-900 font-bold text-sm p-1"
                        >
                          ✕
                        </button>
                      </div>

                      <p className="text-xs text-ink-800 font-medium">Was stimmt mit diesem Bucheintrag nicht?</p>

                      <div className="space-y-1.5">
                        {REPORT_REASONS.map((reason, i) => {
                          const checked = selectedReasons.includes(reason);
                          return (
                            <div 
                              key={i} 
                              onClick={() => handleToggleReportReason(reason)}
                              className={`flex items-center space-x-3 p-2.5 rounded-xl border text-xs cursor-pointer transition select-none ${
                                checked 
                                  ? 'bg-burgundy-50 border-burgundy-300 text-burgundy-900 font-semibold' 
                                  : 'bg-paper-50 border-paper-200 text-ink-800 hover:bg-paper-100'
                              }`}
                            >
                              <input 
                                type="checkbox" 
                                checked={checked} 
                                onChange={() => {}} 
                                className="rounded text-burgundy-700 focus:ring-burgundy-700 h-4 w-4 pointer-events-none"
                              />
                              <span className="pointer-events-none">{reason}</span>
                            </div>
                          );
                        })}
                      </div>

                      <div className="space-y-1 pt-1">
                        <label className="text-xs font-medium text-ink-800 block">Zusätzliche Anmerkung (optional):</label>
                        <textarea
                          rows="2"
                          value={reportComment}
                          onChange={(e) => setReportComment(e.target.value)}
                          placeholder="z. B. Der Titel heißt eigentlich..."
                          className="w-full p-2.5 rounded-xl border border-paper-300 bg-paper-50 text-xs text-ink-900 focus:outline-none focus:border-burgundy-700 resize-none font-sans"
                        />
                      </div>
                    </div>

                    <div className="pt-3 flex items-center space-x-2">
                      <button
                        onClick={() => setReportingBook(null)}
                        className="flex-1 py-2.5 bg-paper-100 hover:bg-paper-200 text-ink-800 text-xs font-bold rounded-xl border border-paper-300 transition"
                      >
                        Abbrechen
                      </button>
                      <button
                        onClick={handleSubmitReport}
                        disabled={(selectedReasons.length === 0 && !reportComment.trim()) || isSubmittingReport}
                        className={`flex-1 py-2.5 text-xs font-bold rounded-xl shadow-sm transition ${
                          (selectedReasons.length === 0 && !reportComment.trim()) || isSubmittingReport
                            ? 'bg-paper-300 text-paper-400 cursor-not-allowed'
                            : 'bg-burgundy-700 hover:bg-burgundy-800 text-white active:scale-95'
                        }`}
                      >
                        {isSubmittingReport ? 'Sende...' : 'Meldung absenden'}
                      </button>
                    </div>
                  </>
                )}

              </div>
            </div>
          )}

          {/* DRAWER (FAVORITES & ALREADY READ) */}
          {isFavoritesOpen && (
            <div 
              onClick={(e) => { if (e.target === e.currentTarget) handleCloseDrawer(); }}
              className={`fixed inset-0 z-50 flex justify-end bg-ink-950/40 backdrop-blur-sm ${
                isDrawerClosing ? 'opacity-0 transition-opacity duration-300' : 'animate-backdrop-in'
              }`}
            >
              <div 
                className={`bg-paper-100 w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-5 border-l border-paper-300 overflow-hidden ${
                  isDrawerClosing ? 'animate-drawer-out' : 'animate-drawer-in'
                }`}
              >
                <div>
                  <div className="flex items-center justify-between pb-3">
                    <div className="flex items-center space-x-2">
                      <span className="text-xl">📚</span>
                      <h2 className="font-literary font-bold text-lg text-ink-900">Deine Bibliothek</h2>
                    </div>
                    <button
                      onClick={handleCloseDrawer}
                      className="w-8 h-8 rounded-full bg-paper-200 hover:bg-paper-300 text-ink-800 font-bold flex items-center justify-center transition active:scale-95"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="flex rounded-xl bg-paper-200 p-1 my-3 border border-paper-300">
                    <button
                      onClick={() => setDrawerTab('favorites')}
                      className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${
                        drawerTab === 'favorites' 
                          ? 'bg-burgundy-700 text-white shadow-sm' 
                          : 'text-ink-700 hover:text-ink-900'
                      }`}
                    >
                      ❤️ Favoriten ({favorites.length})
                    </button>
                    <button
                      onClick={() => setDrawerTab('alreadyRead')}
                      className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${
                        drawerTab === 'alreadyRead' 
                          ? 'bg-amber-600 text-white shadow-sm' 
                          : 'text-ink-700 hover:text-ink-900'
                      }`}
                    >
                      📖 Schon gelesen ({alreadyRead.length})
                    </button>
                  </div>
                </div>

                {drawerTab === 'favorites' && favorites.length > 0 && (
                  <div className="mb-2 space-y-2">
                    <button
                      onClick={handleShareFavorites}
                      className="w-full py-2.5 px-3 bg-burgundy-700 hover:bg-burgundy-800 text-white text-xs font-medium rounded-xl shadow-sm flex items-center justify-center space-x-2 transition active:scale-95"
                    >
                      <ShareIcon className="w-4 h-4" />
                      <span>Favoriten-Liste teilen / kopieren</span>
                    </button>
                    {copyNotice && (
                      <p className="text-[11px] text-emerald-800 bg-emerald-50 border border-emerald-200 p-1.5 rounded-lg text-center font-medium transition">
                        ✓ {copyNotice}
                      </p>
                    )}
                  </div>
                )}

                {drawerTab === 'alreadyRead' && alreadyRead.length > 0 && (
                  <div className="mb-2 space-y-2">
                    <button
                      onClick={() => {
                        handleCloseDrawer();
                        fetchAiBookRecommendations(likedThemes, dislikedThemes, true, true);
                      }}
                      className="w-full py-2.5 px-3 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl shadow-sm flex items-center justify-center space-x-2 transition active:scale-95"
                    >
                      <span>🔄 Nochmal suchen (Bereits gelesene ausschließen)</span>
                    </button>
                  </div>
                )}

                <div className="bg-amber-50/80 border border-amber-200 p-2.5 rounded-xl my-1 text-[11px] text-amber-900 flex items-start space-x-2 leading-relaxed">
                  <span className="text-sm flex-shrink-0">ℹ️</span>
                  <p>
                    <strong>Hinweis:</strong> Deine Listen werden im Browser gespeichert und gehen verloren wenn du Browserdaten löschst.
                  </p>
                </div>

                <div className="flex-grow overflow-y-auto space-y-3 custom-scrollbar my-2 pr-1">
                  {drawerTab === 'favorites' ? (
                    favorites.length === 0 ? (
                      <div className="text-center py-12 space-y-2">
                        <div className="text-3xl opacity-50">💔</div>
                        <p className="font-literary text-sm text-ink-800 font-medium">Noch keine Favoriten gespeichert.</p>
                        <p className="text-xs text-ink-700 max-w-xs mx-auto">
                          Tippe bei Empfehlungen auf das Herz-Symbol, um Bücher in deine Merkliste aufzunehmen.
                        </p>
                      </div>
                    ) : (
                      favorites.map((book, idx) => (
                        <div 
                          key={idx}
                          className="bg-white border border-paper-300 rounded-xl p-3.5 shadow-sm space-y-2 relative transition hover:border-burgundy-600/30"
                        >
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <span className="text-[10px] font-bold text-burgundy-700 uppercase tracking-wider block">
                                {book.genre} ({book.year})
                              </span>
                              <h4 className="font-literary font-bold text-sm text-ink-900 leading-tight">
                                {book.title}
                              </h4>
                              <p className="text-xs text-ink-700 font-medium">
                                von {book.author}
                              </p>
                            </div>
                            <button
                              onClick={() => toggleFavorite(book)}
                              className="text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg text-xs font-bold transition flex-shrink-0 active:scale-95"
                              title="Aus Favoriten entfernen"
                            >
                              ✕
                            </button>
                          </div>
                          {book.matchReason && (
                            <p className="text-[11px] text-burgundy-900 bg-burgundy-50 p-2 rounded-lg">
                              🎯 {book.matchReason}
                            </p>
                          )}
                        </div>
                      ))
                    )
                  ) : (
                    alreadyRead.length === 0 ? (
                      <div className="text-center py-12 space-y-2">
                        <div className="text-3xl opacity-50">📖</div>
                        <p className="font-literary text-sm text-ink-800 font-medium">Noch keine Bücher als gelesen markiert.</p>
                        <p className="text-xs text-ink-700 max-w-xs mx-auto">
                          Tippe bei Empfehlungen auf das Buch-Symbol, um gelesene Bücher zu markieren.
                        </p>
                      </div>
                    ) : (
                      alreadyRead.map((book, idx) => (
                        <div 
                          key={idx}
                          className="bg-white border border-paper-300 rounded-xl p-3.5 shadow-sm space-y-2 relative transition hover:border-amber-600/30"
                        >
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <span className="text-[10px] font-bold text-amber-700 uppercase tracking-wider block">
                                Schon gelesen &bull; {book.genre}
                              </span>
                              <h4 className="font-literary font-bold text-sm text-ink-900 leading-tight">
                                {book.title}
                              </h4>
                              <p className="text-xs text-ink-700 font-medium">
                                von {book.author}
                              </p>
                            </div>
                            <button
                              onClick={() => toggleAlreadyRead(book)}
                              className="text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg text-xs font-bold transition flex-shrink-0 active:scale-95"
                              title="Aus 'Schon gelesen' entfernen"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ))
                    )
                  )}
                </div>

                <div className="pt-3">
                  <button
                    onClick={handleCloseDrawer}
                    className="w-full py-2.5 bg-ink-900 hover:bg-ink-950 text-paper-50 text-xs font-literary font-bold rounded-xl transition shadow-sm active:scale-98"
                  >
                    Schließen
                  </button>
                </div>

              </div>
            </div>
          )}

          <footer className="bg-paper-50 border-t border-paper-300 py-3.5 text-center text-[11px] text-ink-700 font-literary flex items-center justify-center space-x-2">
            <span className="font-literary font-normal">BuchKompass &bull; Bene 2026</span>
            {visitorCount !== null && (
            <span className="font-literary font-normal">{visitorCount} Personen nutzen BuchKompass</span>
            )}
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
